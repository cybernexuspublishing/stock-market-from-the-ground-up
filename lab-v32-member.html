const money = n => `$${Number(n).toFixed(2)}`;

const numberEquals = (value, expected, tolerance=.011) =>
  value !== '' && value !== null && value !== undefined && Number.isFinite(Number(value)) && Math.abs(Number(value)-expected)<=tolerance;
function candleMetrics({o,h,l,c}) {
  if (![o,h,l,c].every(Number.isFinite) || h<l || h<Math.max(o,c) || l>Math.min(o,c)) throw new Error('Invalid OHLC geometry');
  const body=Math.abs(c-o), range=h-l;
  return {body,range,percent:range===0?null:body/range*100,direction:c>o?'Bullish':c<o?'Bearish':'Doji'};
}
function weightedAverage(groups) {
  if (!Array.isArray(groups)||!groups.length||groups.some(g=>!Number.isFinite(g.price)||!Number.isFinite(g.volume)||g.volume<=0)) throw new Error('Invalid price/volume input');
  const dollars=groups.reduce((n,g)=>n+g.price*g.volume,0);
  const shares=groups.reduce((n,g)=>n+g.volume,0);
  return {dollars,shares,price:dollars/shares};
}
function runningVWAP(bars) {
  if (!Array.isArray(bars)) throw new Error('Bars must be an array');
  let shares=0,dollars=0;
  return bars.map((b,i)=>{
    candleMetrics(b);
    if (!Number.isFinite(b.v)||b.v<=0) throw new Error('Invalid volume at bar '+i);
    shares+=b.v;dollars+=b.c*b.v;
    return {shares,dollars,vwap:dollars/shares};
  });
}
/** This OHLC-only rule is a descriptive classification, not an intrabar sequence claim. */
function classifyVWAP(previousBar,previousVWAP,currentBar,currentVWAP) {
  const wasAbove=previousBar.c>previousVWAP, nowAbove=currentBar.c>currentVWAP;
  if(wasAbove&&nowAbove)return 'hold';
  if(wasAbove&&!nowAbove)return 'loss';
  if(!wasAbove&&nowAbove)return 'reclaim';
  if(currentBar.h>currentVWAP&&currentBar.c<currentVWAP)return 'failed';
  return 'below';
}
const VWAP_LABELS = {hold:'Holding above VWAP',loss:'Losing VWAP',reclaim:'Reclaiming VWAP',failed:'Possible failed reclaim attempt',below:'Remaining below VWAP'};
function addCalendarDays(date,days) { const d=new Date(date);if(Number.isNaN(d.getTime()))throw new Error('Invalid date');d.setUTCDate(d.getUTCDate()+days);return d.toISOString(); }
function includedCreditAllocation(count,periodEnd,issueId='included') {
  if(!Number.isInteger(count)||count<0)throw new Error('Invalid count');
  return {source:'included',id:issueId,remaining:count,expiresAt:addCalendarDays(periodEnd,60)};
}
function purchasedCreditAllocation(count,id='purchased') {
  if(!Number.isInteger(count)||count<0)throw new Error('Invalid count');
  return {source:'purchased',id,remaining:count,expiresAt:null};
}
function balance(buckets,now=new Date()) {const t=new Date(now).getTime();return buckets.reduce((n,b)=>n+(!b.expiresAt||new Date(b.expiresAt).getTime()>t?b.remaining:0),0);}
function useOneCredit(buckets,now=new Date()) {
  const next=buckets.map(b=>({...b})),t=new Date(now).getTime();
  const allowed=next.filter(b=>b.remaining>0&&(!b.expiresAt||new Date(b.expiresAt).getTime()>t));
  allowed.sort((a,b)=>Number(Boolean(b.expiresAt))-Number(Boolean(a.expiresAt)) || (a.expiresAt||'').localeCompare(b.expiresAt||''));
  if(!allowed.length)return {ok:false,buckets:next,charged:null};
  const selected=next.find(b=>b.id===allowed[0].id);
  selected.remaining--;return {ok:true,buckets:next,charged:{source:selected.source,id:selected.id}};
}
function verifyConfig(config) {
  if(!config||!config.id||!config.title||!['candlestick','vwap'].includes(config.kind)||!Array.isArray(config.questions)||config.questions.length<2)throw new Error('Incomplete Lab configuration');

function candleChart(b){const high= b.h,low=b.l,op=b.o,cl=b.c;const range=Math.max(high-low,.01);const Y=v=>245-((v-low)/range)*183;const ascending=cl>=op;const bw=100,bx=195;const lineColor='#70dfb9';const labels=[{name:'HIGH',v:high},{name:'CLOSE',v:cl},{name:'OPEN',v:op},{name:'LOW',v:low}];return `<div class="chart-shell"><div class="chart-head"><strong>Candlestick Structure · 5-minute interval</strong><span class="badge">Synthetic example</span></div><div class="chart-layout"><div class="chart-area"><svg viewBox="0 0 620 310" role="img" aria-label="${esc(candleMetrics(b).direction)} candle with labeled Open High Low Close price levels"><rect width="620" height="310" fill="#0d2235"/>${[55,100,145,190,245].map(y=>`<line x1="19" y1="${y}" x2="609" y2="${y}" stroke="#345069" stroke-dasharray="4 7"/>`).join('')}<line x1="133" x2="133" y1="62" y2="245" stroke="#efc777" stroke-width="5"/><line x1="120" x2="146" y1="62" y2="62" stroke="#efc777" stroke-width="4"/><line x1="120" x2="146" y1="245" y2="245" stroke="#efc777" stroke-width="4"/><line x1="${bx+bw/2}" x2="${bx+bw/2}" y1="62" y2="245" stroke="${ascending?'#71e4b8':'#f1a3ac'}" stroke-width="5"/><rect x="${bx}" y="${Math.min(Y(op),Y(cl))}" width="${bw}" height="${Math.max(3,Math.abs(Y(op)-Y(cl)))}" stroke="${ascending?'#79f0c4':'#ffaab3'}" stroke-width="3" fill="${ascending?'#258569':'#b95660'}"/>${labels.map((d,i)=>`<line x1="300" x2="${i%2===0?399:480}" y1="${Y(d.v)}" y2="${Y(d.v)}" stroke="${i%3===0?'#bfcede':lineColor}" stroke-width="1.6"/><text x="${i%2===0?406:488}" y="${Y(d.v)+5}" fill="#ecf6fd" font-size="15" font-weight="600">${d.name} ${money(d.v)}</text>`).join('')}<text x="17" y="291" fill="${ascending?'#80eac4':'#f1a3ac'}" font-weight="600" font-size="16">${candleMetrics(b).direction.toUpperCase()} CANDLE</text></svg><div class="chart-legend"><span><i class="legend-dot" style="background:#71e4b8"></i>Real body</span><span><i class="legend-dot" style="background:#efc777"></i>Full range</span></div></di function replayChart(){const b=L().sessions[S.scenario], visible=b.slice(0,S.barIndex+1), vals=runningVWAP(visible);const last=visible.at(-1);const lo=Math.min(...visible.map(x=>x.l))-.2,hi=Math.max(...visible.map(x=>x.h))+.2;

ill="#e5f1fc" font-size="17" font-weight="600">${d.name} ${money(d.v)}</text>`).join(''):''}<text x="16" y="20" fill="#afc6d9" font-size="15">VWAP preview · fictional close × volume bars only</text></svg><div class="chart-legend"><span><i class="legend-dot" style="background:#6ddfb7"></i>Green candle</span><span><i class="legend-dot" style="background:#b95867"></i>Red candle</span><span><i class="legend-dot" style="background:#f5c97e"></i>VWAP</span><span><i class="legend-dot" style="background:#456ca0"></i>Volume</span></div></div><aside class="chart-data"><h3>Current Candle</h3><label class="small"><input type="checkbox" data-input="showTable" ${S.showTable?'checked':''}> Show OHLC reference</label>${S.showTable?labels.map(l=>`<div class="ohlc-row"><span>${l.name}</span><strong>${money(l.v)}</strong></div>`).join(''):''}<div class="ohlc-row"><span>Volume</span><strong>${last.v} shares</strong></div><div class="ohlc-row"><span>Running VWAP</span><strong>${money(vals.at(-1).vwap)}</strong></div><div class="ohlc-row"><span>Cumulative shares</span><strong>${vals.at(-1).shares}</strong></div><p class="live-note">VWAP = cumulative (bar close × volume) ÷ cumulative share volume. Not trade-level VWAP.</p></aside></div></div>`}
function transfer(){if(!isV()){const c=L().transfer,m=candleMetrics(c);const opts=choices('tDirection',[['Bullish','Bullish'],['Bearish','Bearish'],['Doji','Doji']],S.transferFields.tDirection||'',S.transferLocked);return h('Transfer — Apply the skill to a new bearish candle',`<p>Use the unfamiliar fictional candle below. Determine direction and the body-to-range percentage without assistance.</p>${candleChart(c)}${panel(`<h3>Unfamiliar independent application</h3>${opts}<div class="formrow"><label>Body ($)<input type="number" step="any" data-input="tBody" value="${esc(S.transferFields.tBody??'')}" ${S.transferLocked?'disabled':''}></label><label>Range ($)<input type="number" step="any" data-input="tRange" value="${esc(S.transferFields.tRange??'')}" ${S.transferLocked?'disabled':''}></label><label>Body percentage (%)<input type="number" step="any" data-input="tPercent" value="${esc(S.transferFields.tPercent??'')}" ${S.transferLocked?'disabled':''}></label></div>${!S.transferLocked?B('Lock My Answers','lockTransfer','primary',!S.transferFields.tDirection||!['tBody','tRange','tPercent'].every(k=>String(S.transferFields[k]??'').trim())):`${panel(`<h3>New-case worked feedback</h3><p>Close ${money(c.c)} is below Open ${money(c.o)}, so the candle is bearish.</p><p>Body = |${money(c.c)} − ${money(c.o)}| = ${money(m.body)}. Range = ${money(c.h)} − ${money(c.l)} = ${money(m.range)}.</p><div class="eq">${m.body.toFixed(2)} ÷ ${m.range.toFixed(2)} × 100 = ${m.percent.toFixed(1)}%</div><p>These descriptions do not predict what the next candle will do. Your submitted responses are preserved in this attempt.</p>`,'instruction')}${B('Finish and View Report','next','primary')}`}`,'question')}`)}
const bars=L().sessions[S.scenario], visible=bars.slice(0,S.barIndex+1), totals=runningVWAP(visible);
const prev=visible.at(-2), curr=visible.at(-1), prevV=totals.at(-2), curV=totals.at(-1), exp=classifyVWAP(prev,prevV.vwap,curr,curV.vwap), explanation=explainClassification(prev,prevV.vwap,curr,curV.vwap,exp);
const classificationOptions=Object.entries(VWAP_LABELS).map(([k,v])=>[k,v]);
const currentRecord=S.replayLog.find(r=>r.index===S.barIndex);
const opts=choices('replayChoice',classificationOptions,S.replayChoice,S.replayLocked);
const actions=choices('replayDecision',[['wait','Observe / no trade while evaluating more evidence'],['conditional','Consider a hypothetical long only with a complete entry and risk plan'],['impulsive','Immediately buy solely because of this VWAP event']],S.replayDecision,S.replayLocked);

const rich=`<h3>Full instructor explanation</h3><div class="step-card"><strong>1. Previously observed:</strong> ${esc(explanation.prior)}</div><div class="step-card"><strong>2. Latest evidence:</strong> ${esc(explanation.current)}</div><div class="step-card"><strong>3. Classification:</strong> ${esc(explanation.label)}. ${esc(explanation.interpretation)}</div><div class="step-card"><strong>4. Volume weighting:</strong> Current volume ${curr.v} shares. Running traded value ${money(curV.dollars)}, divided by ${curV.shares} shares, yields VWAP ${money(curV.vwap)}.</div><div class="step-card"><strong>5. Decision:</strong> ${S.replayDecision==='impulsive'?'An immediate long based only on VWAP is not adequately supported.':'Requiring independent confirmation, defined invalidation and appropriate risk is a defensible process.'}</div><p><strong>What the chart cannot establish:</strong> ${esc(explanation.limitations)}</p><p><strong>Another possible interpretation:</strong> A test near VWAP may be meaningful even if it has not yet formed a confirmed reclaim. Avoid claiming an exact intrabar crossing sequence from five-minute OHLC alone.</p><p class="small">This explanation uses only the latest and earlier revealed bars. It never references a later bar.</p>`;
return h('Transfer — Controlled VWAP market replay',`<div class="title-actions"><span class="badge">Scenario ${S.scenario} · Revealed ${visible.length}/${bars.length}</span><span class="badge">${S.replayLocked?'Classification locked':'Future bars concealed'}</span></div>${panel(`<strong>How this replay works</strong><p>Only completed candles through ${curr.t} are visible. You must classify the latest VWAP behavior, choose a hypothetical action and record your expectation before advancing. Later candles remain hidden until you lock your analysis.</p><label class="toggle"><input type="checkbox" data-input="replayPreview" ${S.replayPreview?'checked':''}> Simulate server replay entitlement</label>${!S.replayPreview?`<div class="warn">Replay blocked by the simulated feature entitlement. The production site must enforce this on the server; selecting Full Platform does not bypass this separate access check.</div>`:''}`,'instruction')}${S.replayPreview?`${replayChart()}${S.barIndex>2?panel(`<h3>Check the previous forecast</h3><p>The previous locked forecast was <strong>${esc(S.replayLog.at(-1)?.forecast||'—')}</strong>. The newly revealed ${curr.t} close is ${curr.c>curV.vwap?'above':'below'} the new running VWAP. Predictions and chart classification are evaluated separately.</p>`,'feedback'):''}${panel(`<h3>Analyze the latest completed candle</h3><p><strong>1. Select its VWAP behavior</strong></p>${opts}<div class="line"></div><strong>2. Choose a hypothetical action</strong>${actions}<div class="line"></div><strong>3. Forecast the next candle</strong>${forecastOpts}<label>Your reasoning (optional)<textarea data-input="replayReason" ${S.replayLocked?'disabled':''} placeholder="What evidence justifies your answer?">${esc(S.replayReason)}</textarea></label>${!S.replayLocked?`${S.replayAttempts>0?`<div class="feedback"><strong class="warning">Correction needed — try again</strong><p>Compare each completed close with its own corresponding VWAP. A cross down is a loss; a cross up is a reclaim. An intrabar high above end-of-bar VWAP followed by a below-VWAP close can suggest a failed attempt.</p><span class="small">${S.replayAttempts} incorrect attempt(s)</span></div>`:''}${!isFormal()?B(S.replayAssisted?'Hide Free Instruction':'Explain This VWAP Pattern — Free','toggleReplayHelp'):''}${S.replayAssisted?panel(`<h3>Free focused teaching</h3><p>${esc(explanation.prior)}</p><p>${esc(explanation.current)}</p><p>A hold is two closes above VWAP. A loss crosses from above to below. A reclaim crosses from below to above. A possible failed test reaches above VWAP but closes below.</p><p>Do not infer exact intrabar ordering from these OHLC values.</p>`,'instruction'):''}${B('Lock My Analysis','lockReplay','primary',!S.replayChoice||!S.replayDecision||!S.replayForecast)}${S.replayAttempts>=3&&!isFormal()?B('Record as Assisted and Continue','forceReplay'):''}`:`${panel(`<h3>Analysis recorded</h3><p>Submitted classification: <strong>${esc(VWAP_LABELS[S.replayChoice])}</strong>. Attempts: ${currentRecord?.attempts??1}. ${isFormal()?'Scoring feedback is withheld until the final report.':'Instructor review follows.'}</p>${!isFormal()?rich:''}`,'feedback')}${B(S.barIndex===bars.length-1?'Complete Replay → Results':'Reveal Next Candle','advanceReplay','primary')}`}`,'question')}`:B('Continue without replay entitlement (no replay score)','replayBlocked','secondary')}`)}
function results(){const practice=L().questions.map(q=>[q.id,S.practiceKinds[q.id]||'Not attempted']);let body=`<div class="grid3"><div class="metric"><span>Independent assessment</span><strong>${S.assessmentLocked?assessmentNumbers(L().assessment).filter((n,i)=>numberEquals(S.assessmentFields['a'+i],n,i===2?.12:.015)).length+'/3':'—'}</strong></div><div class="metric"><span>Extra assessment retries</span><strong>${S.retryCount}</strong></div><div class="metric"><span>Simulated credits left</span><strong>${walletBalance()}</strong></div></div>${panel(`<h3>Instructional evidence</h3>${practice.map(([id,kind])=>`<div class="ohlc-row"><span>${esc(id)}</span><strong>${esc(kind)}</strong></div>`).join('')}<p>Reveal / Skip is never counted as independent mastery. A corrected or assisted response is separately labeled.</p>`,'instruction')}`;
if(isV()){
 const accuracy=S.replayLog.filter(r=>r.choice===r.correct&&r.attempts===1&&!r.assisted).length;
 body+=panel(`<h3>Controlled VWAP replay results</h3><p>First-attempt correct and unassisted: <strong>${accuracy}/${S.replayLog.length}</strong>. Session: ${S.scenario}.</p>${S.replayLog.map((r,i)=>{const session=L().sessions[S.scenario],totals=runningVWAP(session.slice(0,r.index+1));const p=session[r.index-1],c=session[r.index],pv=totals[r.index-1].vwap,v=totals[r.index].vwap,e=explainClassification(p,pv,c,v,r.correct);return `<div class="report-row"><strong>${c.t}: ${esc(VWAP_LABELS[r.correct])}</strong><p>Submitted: ${esc(VWAP_LABELS[r.choice])}, ${r.attempts} attempt(s), ${r.assisted?'assisted':'unassisted'}.</p><p>${esc(e.prior)} ${esc(e.current)} ${esc(e.interpretation)}</p><p class="small">Current volume: ${c.v} shares. Cumulative bar-close × volume value: ${money(totals.at(-1).dollars)} across ${totals.at(-1).shares} shares. This weighted reference does not establish exact intrabar ordering.</p><p class="small">${esc(e.limitations)}</p><p class="small">Decision: ${esc(r.decision)}. Forecast: ${esc(r.forecast)}.${i<S.replayLog.length-1?` Next close actually: ${session[r.index+1].c>runningVWAP(session.slice(0,r.index+2)).at(-1).vwap?'above':'below'} next VWAP.`:''}</p></div>`}).join('')}`,'instruction');
 }else{
 const c=L().transfer,m=candleMetrics(c),f=S.transferFields,sc=Number(f.tDirection===m.direction)+Number(numberEquals(f.tBody,m.body))+Number(numberEquals(f.tRange,m.range))+Number(numberEquals(f.tPercent,m.percent,.12));body+=panel(`<h3>Independent unfamiliar candle</h3><p>Transfer score: ${S.transferLocked?sc+'/4':'Not submitted'}.</p><p>Correct direction ${m.direction}; body ${money(m.body)}; range ${money(m.range)}; body percentage ${m.percent.toFixed(1)}%.</p>`,'instruction');}
 return h('Your Learning Development Report',`<p>These are in-memory reference results, not verified competency grades or production completion.</p>${body}${panel(`<h3>Recommended next step</h3><p>Complete another unfamiliar example, then a delayed retention exercise. Verified historical charting and the existing 30-competency framework are required before production certification.</p>${isV()?B('Try Other Synthetic Replay Scenario','switchScenario','primary'):''}${B('Restart This Reference Lab','restart')}`,'instruction')}`);

function render(){const section=[start,intro,experiment,predict,practice,assess,review,transfer,results][S.stage];root.innerHTML=`<div class="shell">${header()}${nav()}<div class="content">${section()}<div class="actions">${S.stage>0&&S.stage<=4?B('← Previous instructional stage','previous'):''}<span class="small">No production account, real trades, or Stripe charges are connected.</span></div></div></div>`}
function updateEnabled(){
 const toggle=(action,allowed)=>root.querySelectorAll('button[data-action="'+action+'"]').forEach(b=>{b.disabled=!allowed});
 toggle('introCheck',!!S.introAnswer);
 toggle('expCheck',!!S.expAnswer);
 toggle('predCheck',!!S.predAnswer);
 const q=S.stage===4?L().questions[S.practiceIdx]:null;
 if(q){const mc=(S.practiceAttempts[q.id]||0)>=2;toggle('checkPractice',mc?!!S.practiceChoice:String(S.practiceAnswers[q.id]??'').trim()!=='')}

function onInput(e) {
 try {
 const el=e.target,key=el.dataset.input;
 if(!key)return;
 const v=el.type==='checkbox'?el.checked:el.value;
 if(key==='lab'){S=fresh(v,'Guided',S.wallet);render();return}
 if(key==='previewTier'){S.previewTier=v;render();return}
 if(key==='replayPreview'){S.replayPreview=v;render();return}
 if(key==='showTable'){S.showTable=v;render();return}
 if(key==='expVolume'){S.expVolume=Number(v);render();return}
 if(key==='expClose'){S.expClose=Number(v);render();return}
 if(key==='introAnswer'||key==='expAnswer'||key==='predAnswer'||key==='practiceChoice'||key==='replayChoice'||key==='replayDecision'||key==='replayForecast'){S[key]=v;return}
 if(key==='practiceAnswer'){S.practiceAnswers[el.dataset.question]=v;return}
 if(/^a[0-2]$/.test(key)){S.assessmentFields[key]=v;return}
 if(/^r[0-2]$/.test(key)){S.retryFields[key]=v;return}
 if(/^t(Body|Range|Percent|Direction)$/.test(key)){S.transferFields[key]=v;return}
 if(key==='replayReason'){S.replayReason=v;return}
 } finally { updateEnabled(); }
}
root.addEventListener('input',onInput);
root.addEventListener('change',e=>{
  // Some browsers only dispatch `change` on a range release.
  if(e.target.matches('input[type="range"]'))onInput(e);
});
root.addEventListener('click',e=>{
 const button=e.target.closest('button[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action,v=button.dataset.value;
 switch(action){
  case 'modeMenu':S.menu=!S.menu;break;

  case 'closeMenu':S.menu=false;S.modeHelp='';break;
  case 'selectMode':if(v===S.mode)break;S.menu=false;if(answered()||locked())S.modePending=v;else S.mode=v;break;
  case 'cancelMode':S.modePending='';S.menu=false;break;
  case 'confirmMode':S=fresh(S.lab,S.modePending,S.wallet);break;
  case 'addCredit':S.wallet.push(purchasedCreditAllocation(1,'DEMO-'+S.wallet.length));break;
  case 'replayToggle':S.replayPreview=!S.replayPreview;break;
  case 'next':if(S.stage===0||S.stage===2||S.stage===3||S.stage===6||S.stage===7) setStage(S.stage+1);break;
  case 'previous':if(S.stage>0&&S.stage<=4)S.stage--;break;
  case 'introCheck':if(S.introAnswer===(isV()?'sum':'range')){S.recordedAnswer=true;setStage(2)}else S.introMisses++;break;
  case 'expCheck':if(S.expAnswer===(isV()?'weight':'bear')){S.recordedAnswer=true;setStage(3)}else S.expMisses++;break;

  case 'toggleHelp':S.helpOpen=!S.helpOpen;break;
  case 'checkPractice':{
   const q=L().questions[S.practiceIdx],a=S.practiceAttempts[q.id]||0,mc=a>=2;
   const val=mc?S.practiceChoice:S.practiceAnswers[q.id];
   if(numberEquals(val,q.answer,q.unit==='%'?.12:q.id==='vwap'?.016:.011)){
     S.practiceKinds[q.id]=mc?'Correct with multiple-choice support':S.helpOpen?'Correct after free instruction':a?'Correct after retry':'Correct on first attempt';S.recordedAnswer=true;S.practiceFeedback='';S.helpOpen=true;
   }else{
     S.practiceAttempts[q.id]=a+1;S.practiceFeedback=a+1===1?'Check the values and units. The free instructor below can explain every step.':a+1===2?'Multiple-choice choices are now available. You may also study the free full explanation.':'Review the worked solution, identify the error, then try again or study the free mini-lesson.';S.practiceChoice='';S.recordedAnswer=true;
   }

  case 'cancelCredit':S.pendingCredit='';break;
  case 'confirmCredit':{
    const allowed=eligibleCredits(),r=useOneCredit(allowed,today);
    if(r.ok){S.wallet=S.wallet.map(b=>r.buckets.find(x=>x.id===b.id)||b);const q=L().questions[S.practiceIdx];S.practiceKinds[q.id]=S.pendingCredit==='reveal'?'reveal':'skip';S.helpOpen=S.pendingCredit==='reveal';S.recordedAnswer=true;S.pendingCredit=''}
    break;
  }
  case 'submitAssessment':{
    if(!['a0','a1','a2'].every(k=>String(S.assessmentFields[k]??'').trim()))break;
    S.assessmentLocked=true;S.recordedAnswer=true;setStage(6);break;
  }
  case 'submitRetry':if(['r0','r1','r2'].every(k=>String(S.retryFields[k]??'').trim())){S.retryLocked=true;S.retryCount++}break;
  case 'nextRetry':S.retryCase++;S.retryFields={};S.retryLocked=false;break;
  case 'lockTransfer':if(['tBody','tRange','tPercent','tDirection'].every(k=>String(S.transferFields[k]??'').trim()))S.transferLocked=true;break;
  case 'setChart':S.display=v;break;
  case 'toggleReplayHelp':S.replayAssisted=!S.replayAssisted;break;

    const bars=L().sessions[S.scenario],vwap=runningVWAP(bars.slice(0,S.barIndex+1)),p=bars[S.barIndex-1],c=bars[S.barIndex],correct=classifyVWAP(p,vwap.at(-2).vwap,c,vwap.at(-1).vwap);

  }

    if(S.replayAttempts<3||isFormal()||S.replayLocked)break;
    const bars=L().sessions[S.scenario],vwap=runningVWAP(bars.slice(0,S.barIndex+1)),p=bars[S.barIndex-1],c=bars[S.barIndex],correct=classifyVWAP(p,vwap.at(-2).vwap,c,vwap.at(-1).vwap);
    S.replayLog.push({index:S.barIndex,choice:S.replayChoice,correct,attempts:S.replayAttempts+1,assisted:true,decision:S.replayDecision,forecast:S.replayForecast,reason:S.replayReason});S.replayLocked=true;break;
  }
  case 'advanceReplay':{
    if(!S.replayLocked)break;
    if(S.barIndex===L().sessions[S.scenario].length-1){setStage(8)}else{S.barIndex++;S.replayChoice='';S.replayDecision='';S.replayForecast='';S.replayReason='';S.replayAttempts=0;S.replayAssisted=false;S.replayLocked=false}break;
  }
  case 'replayBlocked':setStage(8);break;
  case 'switchScenario':{
    S.pastRuns.push({scenario:S.scenario,records:S.replayLog});S.scenario=S.scenario==='A'?'B':'A';S.barIndex=2;S.replayLog=[];S.replayChoice='';S.replayDecision='';S.replayForecast='';S.replayReason='';S.replayAttempts=0;S.replayAssisted=false;S.replayLocked=false;S.stage=7;break;
  }
  case 'restart':S=fresh(S.lab,S.mode,S.wallet);break;
 }
 render();
});
render();</script></body></html>
