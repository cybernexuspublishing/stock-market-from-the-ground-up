name: Backend Contract v0.14.0.32-R1
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel obsolete push checks, preserve isolated manual/explicit reruns.
concurrency:
  group: backend-source-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
jobs:
  turnstile-password-confirmation-and-lemon:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security source checks and runtime syntax
        run: python tests/test_v014032r1_release.py
      - name: Password verification and failed-auth tests
        run: node tests/test_v014032r1_stepup.mjs
      - name: Existing Lemon webhook rejects unsigned events
        run: node tests/test_v014032r1_lemon_hook.mjs
      - name: Prepare isolated Chromium browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Accessible admin password confirmation dialog
        run: python tests/test_v014032r1_browser.py
      - name: Keep backend SQL and APIs out of public assets
        run: |
          bash scripts/build-pages.sh
          test ! -e public/supabase
          test ! -e public/functions
          test ! -e public/tests
          test ! -e public/data/interactive-labs.json
