name: Admin Clarity and CAPTCHA Guidance v0.14.0.34
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-security-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and authorization boundary checks
        run: |
          python tests/test_v014034_admin_accessibility.py
          python tests/test_v014033_payment_source.py
          python tests/test_v014032r2_payment_source.py
      - name: Isolated browser tests
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
          python tests/test_v014034_password_browser.py
          python tests/test_v014033_admin_payment_browser.py
          python tests/test_v014032r2_browser.py
      - name: Cloudflare build boundaries
        run: |
          bash scripts/build-pages.sh
          test ! -e public/functions
          test ! -e public/supabase
          test ! -e public/tests
