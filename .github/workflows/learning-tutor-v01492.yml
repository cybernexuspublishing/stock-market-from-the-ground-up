permissions:
  contents: read
jobs:
  learning-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tutor safety and learning source checks
        run: |
          node --check functions/_middleware.js
          node --check functions/api/site-announcements.js
          node --check functions/api/lab-content.js
          node --check assets/js/site-lab-experience.js
          node --check functions/api/training-editor.js
          node --check functions/api/competencies.js
          node --check assets/js/skills.js
          node --check assets/js/training-editor.js
          node --check functions/api/interactive-training.js
          node --check functions/api/market-tutor-v01492.js
          node --check functions/api/member-tool-access.js
          node --check functions/_lib/tutor-topics-v01492.js
          node --check functions/_lib/replay-engine-v01492.js
          node --check assets/js/lab-player.js
          node --check assets/js/site-lab-experience.js
          node --check assets/js/lab-registry.js
          node --check assets/js/market-tutor.js
          node --check assets/js/lab-registry.js
          node --check functions/api/learning-replay-v01492.js
          node --check assets/js/verified-replay-v01492.js
          node tests/test_v014092_market_tutor_contract.mjs
          node tests/test_v014095_training_tutor_integration.mjs
          node tests/test_v014096_419_conceptual_training.mjs
          node tests/test_v014098_integrated_skills_review.mjs
          node tests/test_v014099_curriculum_contract.mjs
          node tests/test_v014099_owner_review_pagination.mjs
          node tests/test_v014098_replay_lower_plan_registry.mjs
          node tests/test_v014098_audit_execution_quality.mjs
          node tests/test_v014097_original_replay_safety.mjs
          node tests/test_v014095_middleware_opaque_key.mjs
          node tests/test_v014092_replay_contract.mjs
          node tests/v01415_community_api.mjs
      - name: Build output privacy boundary
        run: |
          bash scripts/build-pages.sh
          test -f public/assets/js/market-tutor.js
          test -f public/verified-replay.html
          test -f public/assets/js/verified-replay-v01492.js
          test ! -e public/functions
          test ! -e public/supabase
