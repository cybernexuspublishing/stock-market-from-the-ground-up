          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tutor safety and learning source checks
        run: |
          node --check functions/_middleware.js
          node --check functions/api/admin-forum-actions.js
          node --check functions/api/admin-v0133.js
          node --check functions/api/checkout-v0135.js
