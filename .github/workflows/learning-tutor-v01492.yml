          node --check assets/js/skills.js
          node --check functions/api/owner-roadmap.js
          node --check functions/api/member-tutor-history-v014102.js
          node --check functions/_lib/tutor-response-scaffold-v014102.js
          node --check assets/js/lab-registry.js
          node --check functions/api/learning-replay-v01492.js
          node --check assets/js/verified-replay-v01492.js
          node tests/test_v014100_free_competency_tutor.mjs
