name: Yahoo Master Cloudflare Pages — Paused Manual Fallback
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_MASTER to authorize the manual fallback Pages deploy'
        required: true
        type: string
permissions:
  contents: read
jobs:
  deploy:
    # PAUSED intentionally: GitHub-native main deployment remains authoritative.
    # The configured destination is the Yahoo master only, NEVER the interim account.
    # Any manual reactivation requires separate release review and a scoped credential.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build strictly allowlisted Pages site
        env:
          GU_PUBLIC_SITE_ORIGIN: 'https://stock-market-from-the-ground-up-d1r.pages.dev'
        run: |
          bash scripts/build-pages.sh
          test -f public/index.html
          test -d functions
          test ! -d public/functions
          test ! -d public/.git
          test ! -e public/.mcp.json
          test ! -d public/supabase
          test ! -d public/workers
          test ! -d public/tests
      - name: Deploy Yahoo master account (fallback PAUSED)
        env:
          CLOUDFLARE_ACCOUNT_ID: '4fe9e562905cf607b6f004d2374299fc'
          CLOUDFLARE_API_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.152.0 pages deploy public --project-name=stock-market-from-the-ground-up --branch=main
