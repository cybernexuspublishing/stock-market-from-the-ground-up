name: Learning Picker and ECharts Progress V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/learning-picker-progress-v1.yml'
      - 'assets/js/learning-destination-picker-v1.js'
      - 'assets/js/learning-progress-echarts-v1.js'
      - 'assets/js/bootcamp-academy-v014168.js'
      - 'assets/js/lab-engine-v32-universal.js'
      - 'assets/css/learning-workstation-v44.css'
      - 'assets/css/learning-destination-picker-v1.css'
      - 'lab-player.html'
      - 'bootcamp-academy.html'
      - 'tests/test_learning_destination_picker_browser_v2.mjs'
      - 'tests/test_learning_progress_echarts_v1.mjs'
jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify compact search and ECharts stage progress
        run: |
          node --check assets/js/learning-destination-picker-v1.js
          node --check assets/js/learning-progress-echarts-v1.js
          node --check assets/js/bootcamp-academy-v014168.js
          node --check assets/js/lab-engine-v32-universal.js
          node tests/test_learning_destination_picker_v1.mjs
          node tests/test_learning_progress_echarts_v1.mjs
          node tests/test_learning_destination_picker_browser_v2.mjs
