name: Lumen Mixed Stripe TEST Shadow Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/_lib/lumen-mixed-test-v1.js'
      - 'functions/_lib/lumen-mixed-test-webhook-v1.js'
      - 'functions/api/lumen-mixed-test-checkout.js'
      - 'functions/api/gu39-stripe-webhook.js'
      - 'supabase/migrations/20261029_lumen_mixed_stripe_test_shadow_end_to_end_v1.sql'
      - 'supabase/migrations/20261029_lumen_mixed_test_event_replay_guard_v1.sql'
      - 'supabase/migrations/20261029_lumen_mixed_test_shadow_indexes_v1.sql'
      - 'tests/test_lumen_mixed_stripe_test_end_to_end_v1.mjs'
      - 'assets/js/owner-lumen-mixed-test-v1.js'
      - 'admin-lumen-mixed-test.html'
      - '.github/workflows/lumen-mixed-stripe-test-v1.yml'
permissions:
  contents: read
jobs:
  stripe-test-shadow-noncharging:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated QA sources and browser script
        run: |
          node --check functions/_lib/lumen-mixed-test-v1.js
          node --check functions/_lib/lumen-mixed-test-webhook-v1.js
          node --check functions/api/lumen-mixed-test-checkout.js
          node --check functions/api/gu39-stripe-webhook.js
          node --check assets/js/owner-lumen-mixed-test-v1.js
      - name: Execute signed TEST checkout and reconciliation simulation
        run: node tests/test_lumen_mixed_stripe_test_end_to_end_v1.mjs
      - name: Retain boundary tests for published customer checkout
        run: |
          node tests/test_lumen_mixed_checkout_quote_v1.mjs
          node tests/test_lumen_fully_paid_tool_v1.mjs
