name: Website Source Backup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    name: Archive tracked website files
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build clean restore-ready source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          sha="${GITHUB_SHA:0:12}"
          stamp="$(date -u +%Y%m%d)"
          version="v$(python3 -c 'import json; print(json.load(open("release-manifest.json"))["version"])')"
          archive="${version}_GU-Website-Source-${stamp}-${sha}.zip"
          # Git archive includes only committed tracked files, not Git history,
          # local credentials, Cloudflare environment variables or DB data.
          git archive --format=zip -o "backup/$archive" "${GITHUB_SHA}"
          unzip -tq "backup/$archive" >/dev/null
          (cd backup && sha256sum "$archive" > "${archive}.sha256")
          printf 'Source repository: %s\nCommit: %s\nUTC archive date: %s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$stamp" > backup/SOURCE_BACKUP_INFO.txt
          cat >> backup/SOURCE_BACKUP_INFO.txt <<'EOF'
          Contents: committed website source, Cloudflare Functions, GitHub Actions,
          Supabase SQL migration files, documentation and tests.
          Not included: live Supabase tables/auth records/storage, Cloudflare environment
          secrets/settings, Stripe Dashboard products and Stripe subscriptions.
          To restore runtime state, separately export provider settings and database
          backups with authorized provider access and protected offline storage.
          EOF
      - name: Attach downloadable archive and SHA-256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: v0.14.0.58_website-source-backup-${{ github.run_number }}
          path: backup/*
          if-no-files-found: error
          retention-days: 30
