name: Shared Lab Engine v3.3 Verification
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/member-tool-access.js'
      - 'assets/js/lab-player.js'
      - 'assets/js/lab-engine-v32-universal.js'
      - 'assets/js/lab-journey-checkpoint-v33.js'
      - 'lab-player.html'
      - 'tests/test_v33_member_checkpoint_resume.mjs'
      - 'tests/test_v33_checkpoint_acknowledgement.mjs'
      - 'tests/test_v135_public_assessment_projection.mjs'
      - 'functions/api/assessment-v0135.js'
      - 'supabase/migrations/20261027_lab_journey_v33_private_checkpoint.sql'
      - 'supabase/migrations/20261027_lab_journey_v33_legacy_merge_guard.sql'
      - 'supabase/rollbacks/20261027_lab_journey_v33_legacy_merge_guard_ROLLBACK.sql'
      - 'tests/test_lab_content_access_recovery.mjs'
      - 'functions/api/lab-player-context.js'
      - 'functions/api/interactive-training.js'
      - 'functions/api/lab-content.js'
      - 'functions/_lib/founding-beta-learning-access.js'
      - 'tests/test_founder_beta_scoped_learning_access.mjs'
      - 'functions/api/competencies.js'
      - 'assets/js/interactive-training.js'
      - 'tests/v014_api_contracts.mjs'
      - 'tests/test_grading_partial_credit_critical_guard.mjs'
      - 'tests/test_v014117_lab_topic_gate.mjs'
      - 'functions/api/training-editor.js'
      - 'assets/js/training-editor.js'
      - 'tests/test_v014_owner_grading_metadata_ui.mjs'
      - 'supabase/migrations/20261026_grading_partial_credit_critical_errors.sql'
      - 'supabase/rollbacks/20261026_grading_partial_credit_critical_errors_ROLLBACK.sql'
      - 'tests/test_v014099_curriculum_contract.mjs'
      - 'tests/test_v014162_lab_player_context.mjs'
      - 'tests/test_lab_access_rpc_resilience.mjs'
      - '.github/workflows/shared-lab-engine-v33.yml'
  pull_request:
    paths:
      - 'assets/js/lab-engine-v32-universal.js'
      - 'assets/js/lab-engine-v32-teaching.js'
      - 'assets/js/lab-engine-v33-visual.js'
      - 'assets/js/lab-player.js'
      - 'functions/api/lab-content.js'
      - 'functions/api/interactive-training.js'
      - 'functions/api/lab-content.js'
      - 'functions/_lib/founding-beta-learning-access.js'
      - 'tests/test_founder_beta_scoped_learning_access.mjs'
      - 'functions/api/competencies.js'
      - 'assets/js/interactive-training.js'
      - 'tests/v014_api_contracts.mjs'
      - 'tests/test_grading_partial_credit_critical_guard.mjs'
      - 'tests/test_v014117_lab_topic_gate.mjs'
      - 'functions/api/training-editor.js'
      - 'assets/js/training-editor.js'
      - 'tests/test_v014_owner_grading_metadata_ui.mjs'
      - 'supabase/migrations/20261026_grading_partial_credit_critical_errors.sql'
      - 'supabase/rollbacks/20261026_grading_partial_credit_critical_errors_ROLLBACK.sql'
      - 'tests/test_v014099_curriculum_contract.mjs'
      - 'functions/api/lab-player-context.js'
      - 'tests/test_lab_content_access_recovery.mjs'
      - 'tests/test_v014162_member_player_browser.mjs'
      - 'assets/css/lab-engine-v32-teaching.css'
      - 'tests/lab-engine-v33.test.mjs'
      - 'tests/lab-engine-v33-visual.test.mjs'
      - '.github/workflows/shared-lab-engine-v33.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-curriculum-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check assets/js/lab-player.js
          node --check assets/js/lab-journey-checkpoint-v33.js
          node tests/test_v33_member_checkpoint_resume.mjs
          node tests/test_v33_checkpoint_acknowledgement.mjs
          node tests/test_v135_public_assessment_projection.mjs
          node --check functions/api/assessment-v0135.js
          node --check assets/js/lab-engine-v32-universal.js
          node --check assets/js/lab-engine-v32-teaching.js
          node --check assets/js/lab-engine-v33-visual.js
          node tests/lab-engine-v33-visual.test.mjs
          node tests/test_v014162_419_universal.mjs
          node tests/lab-engine-v33.test.mjs
          node tests/test_v014099_curriculum_contract.mjs
          node tests/v014_api_contracts.mjs
          node tests/test_founder_beta_scoped_learning_access.mjs
          node --check functions/_lib/founding-beta-learning-access.js
          node tests/test_grading_partial_credit_critical_guard.mjs
          node tests/test_v014117_lab_topic_gate.mjs
          node tests/test_v014_owner_grading_metadata_ui.mjs
          node --check assets/js/training-editor.js
          node --check functions/api/interactive-training.js
          node --check functions/api/competencies.js
          node --check assets/js/interactive-training.js
          node tests/test_v014096_419_conceptual_training.mjs
          node tests/test_lab_content_access_recovery.mjs
          node tests/test_v014162_lab_player_context.mjs
          node tests/test_lab_access_rpc_resilience.mjs
          bash scripts/build-pages.sh
          test -f public/lab-player.html
          test -f public/assets/js/lab-journey-checkpoint-v33.js
          test -f public/assets/js/lab-engine-v32-universal.js
          test -f public/assets/js/lab-engine-v33-visual.js
          test -f public/assets/css/lab-engine-v32-teaching.css
