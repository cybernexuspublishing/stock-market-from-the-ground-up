name: Storefront v0.14.0.85 — Actual Browser Acceptance (No Charges)
on:
  pull_request:
    paths:
      - 'tests/test_v014085_production_storefront_playwright.mjs'
      - 'tests/test_v014085_bundled_guide_contract.mjs'
      - '.github/workflows/storefront-live-acceptance-v01485.yml'
      - 'assets/js/store.js'
      - 'assets/js/store-catalog-visuals-v1.js'
      - 'assets/js/store-inventory-ui-v014174.js'
      - 'functions/api/storefront-public-catalog.js'
      - 'tests/test_store_catalog_media_contract_v1.mjs'
      - 'assets/js/commerce-presentation.js'
      - 'tests/test_v014138_no_legacy_replay_injection.mjs'
      - 'assets/js/store-upcoming-offerings-v01490.js'
      - 'assets/js/admin-products-v01489.js'
      - 'tests/test_admin_products_five_tabs_browser_v2.mjs'
      - 'assets/js/admin-platform.js'
      - 'admin.html'
      - 'tests/test_v014090_commercial_product_inventory.mjs'
      - 'assets/js/commerce-common.js'
      - 'assets/css/store-sales-v01489.css'
      - 'assets/css/store-catalog-v01484.css'
      - 'assets/css/owner-store-layout-v1.css'
      - 'assets/js/production-completion.js'
      - 'src/ts/production-completion.ts'
      - 'tests/test_v014086_legacy_store_tab_guard.mjs'
      - 'assets/js/store-product-detail-v01484.js'
      - 'store.html'
      - 'store-*.html'
  push:
    branches: [main]
    paths:
      - 'tests/test_v014085_production_storefront_playwright.mjs'
      - '.github/workflows/storefront-live-acceptance-v01485.yml'
      - 'assets/js/store-product-detail-v01484.js'
      - 'assets/js/store.js'
      - 'assets/js/store-catalog-visuals-v1.js'
      - 'assets/js/store-inventory-ui-v014174.js'
      - 'functions/api/storefront-public-catalog.js'
      - 'tests/test_store_catalog_media_contract_v1.mjs'
      - 'assets/js/commerce-presentation.js'
      - 'tests/test_v014138_no_legacy_replay_injection.mjs'
      - 'assets/js/store-upcoming-offerings-v01490.js'
      - 'assets/js/admin-products-v01489.js'
      - 'tests/test_admin_products_five_tabs_browser_v2.mjs'
      - 'assets/js/admin-platform.js'
      - 'admin.html'
      - 'tests/test_v014090_commercial_product_inventory.mjs'
      - 'assets/js/commerce-common.js'
      - 'assets/css/store-sales-v01489.css'
      - 'assets/css/store-catalog-v01484.css'
      - 'assets/css/owner-store-layout-v1.css'
      - 'assets/js/production-completion.js'
      - 'src/ts/production-completion.ts'
      - 'tests/test_v014086_legacy_store_tab_guard.mjs'
      - 'store.html'
      - 'store-*.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-customer-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Verify protected commercial Store and unified Products catalog
        run: |
          node --check assets/js/store.js
          node --check assets/js/store-catalog-visuals-v1.js
          node --check assets/js/store-inventory-ui-v014174.js
          node --check assets/js/legal-platform.js
          node tests/test_store_catalog_media_contract_v1.mjs
          node --check assets/js/store-upcoming-offerings-v01490.js
          node --check assets/js/admin-products-v01489.js
          node --check assets/js/admin-platform.js
          node tests/test_v014090_commercial_product_inventory.mjs
          node tests/test_admin_products_five_tabs_browser_v2.mjs
          node tests/test_v014138_no_legacy_replay_injection.mjs
      - name: Verify no divergence between editorial product guide and packaged production script
        run: node tests/test_v014085_bundled_guide_contract.mjs
      - name: Reject legacy v132 Store tab injection over accessible v84 Store
        run: |
          node --check assets/js/production-completion.js
          node tests/test_v014086_legacy_store_tab_guard.mjs
      - name: Start local branch site for PR quality gate
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gu85-static-site.log 2>&1 &
          sleep 2
      - name: Real browser acceptance — PR against branch, main against Production
        env:
          STOREFRONT_BASE: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:8765' || 'https://stock-market-from-the-ground-up-d1r.pages.dev' }}
        run: |
          node tests/test_v014085_production_storefront_playwright.mjs
      - name: Diagnose LIVE production Store before release (no-charge, read-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          STOREFRONT_BASE: https://stock-market-from-the-ground-up-d1r.pages.dev
        run: node tests/test_v014085_production_storefront_playwright.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-v014085-browser-acceptance
          path: storefront-v014085-acceptance.json
          if-no-files-found: warn
          retention-days: 30
