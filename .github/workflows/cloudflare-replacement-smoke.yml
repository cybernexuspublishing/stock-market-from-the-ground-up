name: Cloudflare Replacement — Read-only Smoke Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/cloudflare-replacement-smoke.mjs'
      - '.github/workflows/cloudflare-replacement-smoke.yml'
permissions:
  contents: read
concurrency:
  group: cloudflare-replacement-readonly-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify replacement publicly without any Stripe writes
        run: node tests/cloudflare-replacement-smoke.mjs
