name: Interim Cloudflare — Historical Read-only Rollback Smoke
on:
  workflow_dispatch:
# Deliberately no push trigger: interim Pages is no longer canonical.
permissions:
  contents: read
concurrency:
  group: cloudflare-interim-historical-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical interim site (read only, not release acceptance)
        run: node tests/cloudflare-replacement-smoke.mjs
