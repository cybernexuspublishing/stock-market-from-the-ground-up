name: Social Marketing Owner-only Zero-cost Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/v0.14.0.276_social_marketing_owner_only.sql'
      - 'supabase/migrations/v0.14.0.277_social_audit_rowtype_repair.sql'
      - 'supabase/migrations/v0.14.0.278_social_campaign_content_queue_metrics.sql'
      - 'supabase/migrations/v0.14.0.279_social_account_registry.sql'
      - 'functions/api/admin-social.js'
      - 'functions/_lib/social-provider-capabilities-v014279.mjs'
      - 'assets/js/admin-social-zero-cost.js'
      - 'assets/js/admin-social-operations-v014278.js'
      - 'assets/css/admin-social-zero-cost.css'
      - 'assets/js/admin-marketing-workspace.js'
      - 'tests/test_admin_social_zero_cost.mjs'
      - 'tests/test_social_provider_capabilities.mjs'
      - 'tests/test_admin_social_browser.mjs'
      - '.github/workflows/social-marketing-owner.yml'
permissions:
  contents: read
jobs:
  social-source-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and zero-cost social operations security
        run: |
          node --check functions/api/admin-social.js
          node --check assets/js/admin-social-zero-cost.js
          node --check assets/js/admin-social-operations-v014278.js
          node --check assets/js/admin-marketing-workspace.js
          node --test tests/test_admin_social_zero_cost.mjs
          node --test tests/test_social_provider_capabilities.mjs
      - name: Confirm existing Ads controls and route unaffected
        run: |
          node --test tests/test_ad_sales_security_v014231.mjs
          test -f admin-advertising.html
          test -f functions/api/ad-sales.js
      - name: Install pinned free Chromium browser regression runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-check Owner Social Marketing at 390, 900, 1280, and 1440 px
        run: node tests/test_admin_social_browser.mjs
