name: Live Lab QA (authenticated, no billing)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-lab-qa.yml'
      - 'tests/live-lab-qa.mjs'
      - 'tests/test_james_free_member_commerce_20261030.mjs'
      - 'tests/live-member-browser-qa.mjs'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'functions/_middleware.js'
      - 'tests/test_support_routing_v1.mjs'
permissions:
  contents: read
concurrency:
  group: live-lab-qa-main
  cancel-in-progress: true
jobs:
  verify-authorized-lab-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned open-source browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify James_Test Free entitlement, chart tier, watchlist, Store and Free Foundations without payment
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_james_free_member_commerce_20261030.mjs
      - name: Verify real production member sign-in, receipt UI, full reload and sign-out
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/live-member-browser-qa.mjs
      - name: Verify QA member access to live Lab APIs without changing records
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/live-lab-qa.mjs
