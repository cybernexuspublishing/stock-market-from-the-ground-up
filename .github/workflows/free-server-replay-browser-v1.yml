name: Free Server Replay Responsive Browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-server-replay-browser-v1.yml'
      - 'tests/test_free_server_replay_browser_v1.mjs'
      - 'assets/js/verified-replay-v01492.js'
      - 'verified-replay.html'
      - 'functions/api/learning-replay-v01492.js'
permissions:
  contents: read
concurrency:
  group: free-server-replay-browser-main
  cancel-in-progress: false
jobs:
  browser-member-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Free fictional replay at 390, 900, 1280 and 1440
        run: node tests/test_free_server_replay_browser_v1.mjs
