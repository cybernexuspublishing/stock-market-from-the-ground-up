# 2026-10-30 noncharging QA verification: rerun after correcting canonical Lumens assertions.
# Noncharging 2026-10-30 owner acceptance sweep: execute existing QA on main; no payment or live member mutation.
name: Free Foundations and Research Watchlist Security
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-foundations-watchlist-v1.yml'
      - 'functions/_lib/free-foundations-v1.js'
      - 'functions/_lib/free-foundations-phase-a-v1.js'
      - 'tests/test_free_phase_a_teaching_v1.mjs'
      - 'assets/js/free-foundations-formative-v1.js'
      - 'tests/test_free_phase_a_formative_v1.mjs'
      - 'functions/_lib/bootcamp-academy-v014168.js'
      - 'functions/api/bootcamp-academy.js'
      - 'functions/api/free-watchlist.js'
      - 'functions/api/member-tool-access.js'
      - 'functions/api/lab-content.js'
      - 'tests/test_book_entitlement_scope_v1.mjs'
      - 'tests/test_membership_entitlement_boundaries_v1.mjs'
      - 'assets/js/bootcamp-academy-v014168.js'
      - 'assets/js/free-watchlist-v1.js'
      - 'assets/js/free-watchlist-review-v1.js'
      - 'assets/css/free-watchlist-review-v1.css'
      - 'assets/css/watchlist-talia-v4.css'
      - 'assets/js/watchlist-talia-workstation-v4.js'
      - 'tests/test_free_watchlist_review_v1.mjs'
      - 'assets/js/dashboard.js'
      - 'dashboard.html'
      - 'bootcamp-academy.html'
      - 'free-watchlist.html'
      - 'tests/test_free_foundations_shared_v1.mjs'
      - 'tests/test_free_watchlist_v1.mjs'
      - 'tests/test_free_membership_browser_v1.mjs'
      - 'assets/css/free-foundations-guided-v2.css'
      - 'assets/js/free-foundations-teaching-studio-v3.js'
      - 'assets/js/free-foundations-lab-experience-v1.js'
      - 'assets/js/free-foundations-knowledge-v1.js'
      - 'assets/css/free-foundations-knowledge-v1.css'
      - 'tests/test_free_foundations_knowledge_v1.mjs'
      - 'assets/css/free-foundations-lab-experience-v1.css'
      - 'tests/test_free_foundations_lab_experience_v1.mjs'
      - 'assets/css/free-foundations-teaching-studio-v3.css'
      - 'tests/test_free_foundations_studio_v3.mjs'
      - 'assets/js/labs.js'
      - 'tests/test_learning_destination_picker_browser_v2.mjs'
      - 'assets/js/learning-destination-picker-v1.js'
      - 'assets/css/lab-registry-entitlements-v1.css'
      - 'labs.html'
      - 'functions/api/lab-registry-access.js'
      - 'tests/test_lab_registry_access_v1.mjs'
      - 'tests/test_lab_registry_browser_v1.mjs'
      - 'tests/test_free_owner_v1_scope.mjs'
      - 'tests/test_v014170_academy_member_contract.mjs'
      - 'tests/test_v014168_academy_family.mjs'
      - 'tests/test_v014147_tutor_boundary.mjs'
      - 'supabase/migrations/20261026_membership_entitlement_period_boundaries_v1.sql'
      - 'supabase/migrations/20261026_membership_access_display_parity_v1.sql'
      - 'tests/test_membership_access_display_parity_v1.mjs'
      - 'tests/test_membership_entitlement_sql_contract_v1.mjs'
      - 'supabase/migrations/20261026_free_research_watchlist_v1.sql'
      - 'supabase/migrations/20261026_free_foundations_shared_academy_course.sql'
permissions:
  contents: read
jobs:
  contract-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright Chromium for responsive interactive QA
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check source syntax and registered API contracts
        run: |
          node --check functions/_lib/free-foundations-v1.js
          node --check functions/_lib/free-foundations-phase-a-v1.js
          node --check functions/_lib/bootcamp-academy-v014168.js
          node --check functions/api/bootcamp-academy.js
          node --check functions/api/free-watchlist.js
          node --check functions/api/member-tool-access.js
          node tests/test_membership_entitlement_boundaries_v1.mjs
          node tests/test_membership_entitlement_sql_contract_v1.mjs
          node tests/test_membership_access_display_parity_v1.mjs
          node tests/test_book_entitlement_scope_v1.mjs
          node --check assets/js/bootcamp-academy-v014168.js
          node --check assets/js/free-watchlist-v1.js
          node --check assets/js/dashboard.js
          node tests/test_free_foundations_shared_v1.mjs
          node tests/test_free_phase_a_teaching_v1.mjs
          node --check assets/js/free-foundations-formative-v1.js
          node tests/test_free_phase_a_formative_v1.mjs
          node tests/test_free_watchlist_v1.mjs
          node --check assets/js/free-watchlist-review-v1.js
          node tests/test_free_watchlist_review_v1.mjs
          node tests/test_free_member_launchpad_v1.mjs
          node tests/test_free_owner_v1_scope.mjs
          node tests/test_v014170_academy_member_contract.mjs
          node tests/test_v014168_academy_family.mjs
          node --check assets/js/free-foundations-teaching-studio-v3.js
          node tests/test_free_foundations_studio_v3.mjs
          node --check assets/js/free-foundations-lab-experience-v1.js
          node tests/test_free_foundations_lab_experience_v1.mjs
          node --check assets/js/free-foundations-knowledge-v1.js
          node tests/test_free_foundations_knowledge_v1.mjs
          node tests/test_free_membership_browser_v1.mjs
          node tests/test_learning_destination_picker_browser_v2.mjs
          node --check assets/js/labs.js
          node --check functions/api/lab-registry-access.js
          node tests/test_lab_registry_access_v1.mjs
          node tests/test_lab_registry_browser_v1.mjs
