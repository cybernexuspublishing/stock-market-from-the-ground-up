name: Free Simulator Starter and Market Rights Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulator.html'
      - 'dashboard.html'
      - 'assets/js/dashboard.js'
      - 'assets/css/free-member-launchpad.css'
      - 'tests/test_free_member_launchpad_v1.mjs'
      - 'assets/css/simulator.css'
      - 'assets/js/simulator.js'
      - 'assets/js/simulator-mode-v014112.js'
      - 'assets/js/fictional-simulator-starter-v1.js'
      - 'tests/test_free_simulator_starter_v1.mjs'
      - 'tests/test_free_simulator_browser.mjs'
      - 'tests/test_v014112_server_first_simulator.mjs'
      - '.github/workflows/free-simulator-starter.yml'
permissions:
  contents: read
jobs:
  free-practice-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned free Chromium browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test Free starter, paid-only protections, and rendered browser interactions
        run: |
          node --check assets/js/fictional-simulator-starter-v1.js
          node --check assets/js/simulator.js
          node --check assets/js/simulator-mode-v014112.js
          node --check assets/js/dashboard.js
          node tests/test_free_member_launchpad_v1.mjs
          node tests/test_free_simulator_starter_v1.mjs
          node tests/test_v014112_server_first_simulator.mjs
          node tests/test_free_simulator_browser.mjs
