name: Free Simulator Starter and Market Rights Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulator.html'
      - 'assets/css/simulator.css'
      - 'assets/js/simulator.js'
      - 'assets/js/simulator-mode-v014112.js'
      - 'assets/js/fictional-simulator-starter-v1.js'
      - 'tests/test_free_simulator_starter_v1.mjs'
      - 'tests/test_v014112_server_first_simulator.mjs'
      - '.github/workflows/free-simulator-starter.yml'
permissions:
  contents: read
jobs:
  free-practice-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test genuine interactive free entry and previously protected replay
        run: |
          node --check assets/js/fictional-simulator-starter-v1.js
          node --check assets/js/simulator.js
          node --check assets/js/simulator-mode-v014112.js
          node tests/test_free_simulator_starter_v1.mjs
          node tests/test_v014112_server_first_simulator.mjs
