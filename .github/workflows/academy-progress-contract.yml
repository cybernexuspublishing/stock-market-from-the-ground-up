name: Academy Protected Persistence Contract
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-progress-contract.yml'
      - 'tests/test_academy_progress_contract.mjs'
      - 'tests/test_academy_audit_schema_contract.mjs'
      - 'supabase/migrations/v0.14.0.295_academy_metadata_audit.sql'
      - 'supabase/rollbacks/v0.14.0.295_academy_metadata_audit_ROLLBACK.sql'
      - 'functions/api/bootcamp-academy.js'
      - 'functions/_lib/bootcamp-academy-v014168.js'
      - 'functions/api/member-tool-access.js'
permissions:
  contents: read
jobs:
  verify-private-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise Academy persistence, member isolation and grading protection fixtures
        run: |
          node --test tests/test_academy_progress_contract.mjs
          node tests/test_academy_audit_schema_contract.mjs
          node tests/test_v014170_academy_member_contract.mjs
          node tests/test_b01_owner_revision_lock.mjs
          node tests/test_b01_private_lesson_owner_review.mjs
          node tests/test_b01_review_withdrawal_and_private_grading.mjs
          node tests/test_grading_partial_credit_critical_guard.mjs
          node tests/test_v014280_rubric_review_audit.mjs
