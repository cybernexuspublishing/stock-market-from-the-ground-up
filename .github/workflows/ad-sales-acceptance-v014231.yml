name: Advertising Sales Security & Readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'advertise.html'
      - 'admin-advertising.html'
      - 'admin.html'
      - 'assets/js/ad-inquiry-v014228.js'
      - 'assets/js/admin-ad-sales-v014228.js'
      - 'assets/js/ad-slots-v014229.js'
      - 'assets/css/ad-sales-v014228.css'
      - 'functions/api/ad-sales.js'
      - 'functions/api/ad-slot.js'
      - 'supabase/migrations/v0.14.0.22*'
      - 'supabase/migrations/v0.14.0.230_ad_sales_stripe_quote_only_product_mapping.sql'
      - 'supabase/migrations/v0.14.0.232_ad_destination_regex_length_fix.sql'
      - 'tests/test_ad_sales_security_v014231.mjs'
      - 'tests/test_ad_placement_delivery_v014235.mjs'
      - 'tests/test_ad_sandbox_signed_stripe_v014244.mjs'
      - 'functions/api/gu39-stripe-webhook.js'
      - 'functions/_lib/ad-sandbox-lifecycle-v014242.js'
      - 'supabase/migrations/v0.14.0.23*'
      - '.github/workflows/ad-sales-acceptance-v014231.yml'
permissions:
  contents: read
jobs:
  advertising-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Advertising API, Owner controls and rendering source
        run: |
          node --check functions/api/ad-sales.js
          node --check functions/api/ad-slot.js
          node --check functions/_lib/ad-sandbox-lifecycle-v014242.js
          node --check functions/api/gu39-stripe-webhook.js
          node --check assets/js/ad-inquiry-v014228.js
          node --check assets/js/admin-ad-sales-v014228.js
          node --check assets/js/ad-slots-v014229.js
          node --test tests/test_ad_sales_security_v014231.mjs
          node --test tests/test_ad_placement_delivery_v014235.mjs
          node --test tests/test_ad_sandbox_signed_stripe_v014244.mjs
      - name: Verify deployment stays quote-only, payment-safe, disclosed
        run: |
          grep -q 'Sponsor &amp; Advertising Center' admin.html
          grep -q 'Submit inquiry (no charge)' advertise.html
          grep -q 'Full Monthly and Full Annual may contain limited sponsor placements' advertise.html
          grep -q 'data-ad-slot="HOME_INLINE"' index.html
          grep -q 'data-ad-slot="STORE_INLINE"' store.html
          grep -q 'data-ad-slot="COMMUNITY_INLINE"' market-commons.html
          grep -q 'data-ad-slot="SAMPLE_LABS"' lab-samples.html
          grep -q 'data-ad-slot="FREE_DASHBOARD"' dashboard.html
          grep -q 'ad_delivery_enabled boolean NOT NULL DEFAULT false' supabase/migrations/v0.14.0.226_ad_selling_owner_approval_and_inventory.sql
          grep -q 'accepting_payments boolean NOT NULL DEFAULT false' supabase/migrations/v0.14.0.226_ad_selling_owner_approval_and_inventory.sql
          grep -q 'Owner-controlled' supabase/migrations/v0.14.0.226_ad_selling_owner_approval_and_inventory.sql
          test -f supabase/migrations/v0.14.0.227_ad_sales_verified_invoice_and_campaign_review.sql
          test -f supabase/migrations/v0.14.0.230_ad_sales_stripe_quote_only_product_mapping.sql
          test -f supabase/migrations/v0.14.0.232_ad_destination_regex_length_fix.sql
          test -f supabase/migrations/v0.14.0.233_ad_campaign_delivery_metrics_caps.sql
          test -f supabase/migrations/v0.14.0.234_ad_privacy_session_frequency_index.sql

      - name: Verify isolated Stripe TEST ledger and Owner-gated sandbox checkout
        run: |
          test -f supabase/migrations/v0.14.0.240_advertising_stripe_sandbox_shadow_ledger.sql
          test -f supabase/migrations/v0.14.0.241_ad_sandbox_owner_mode_switch.sql
          grep -q 'handleAdSandbox' functions/api/gu39-stripe-webhook.js
          grep -q 'AD_SANDBOX_2026' functions/api/ad-sales.js
          grep -q 'mode.*payment' functions/api/ad-sales.js
          grep -q 'testing_enabled boolean NOT NULL DEFAULT false' supabase/migrations/v0.14.0.240_advertising_stripe_sandbox_shadow_ledger.sql
          grep -q 'commercialAdActivated' supabase/migrations/v0.14.0.240_advertising_stripe_sandbox_shadow_ledger.sql
