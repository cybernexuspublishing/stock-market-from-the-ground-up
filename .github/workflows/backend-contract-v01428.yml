name: Backend Contract v0.14.0.28
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commerce-and-print-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and print authorization contracts
        run: python tests/test_v014028_commerce_source.py
      - name: Lemon Squeezy physical payment ban and digital eligibility
        run: node tests/test_v014028_commerce_api.mjs
      - name: Browser verification dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Isolated browser proof of safe provider links
        run: python tests/test_v014028_print_browser.py
      - name: Preserve private migration and credential boundary
        run: |
          bash scripts/build-pages.sh
          test ! -e public/supabase
          test ! -e public/functions
          test ! -e public/tests
          test ! -e public/data/interactive-labs.json
