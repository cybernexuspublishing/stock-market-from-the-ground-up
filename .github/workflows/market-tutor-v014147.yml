name: Market Tutor Trust, Member History and Owner Feedback v0.14.0.147
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-party-tutor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy Tutor source/consent/quality and D07 authenticated boundaries
        run: |
          node tests/test_v014092_market_tutor_contract.mjs
          node tests/test_v014093_tutor_practice.mjs
          node tests/test_v014095_training_tutor_integration.mjs
          node tests/test_v014100_free_competency_tutor.mjs
          node tests/test_tutor_stt_research_guides_v1.mjs
          node tests/test_stt_sitewide_reconciliation_v1.mjs
          node tests/test_tutor_video_research_v1.mjs
          node tests/test_tutor_trade_decision_playbooks_v1.mjs
          node tests/test_tutor_advanced_decision_guides_v1.mjs
          node tests/test_tutor_market_study_v1.mjs
          node tests/test_tutor_guided_practice_v1.mjs
          node tests/test_tutor_research_guided_handoff_v1.mjs
          node --check assets/js/tutor-guided-practice-v1.js
          node tests/test_v014102_member_tutor_history.mjs
          node tests/test_v014102_tutor_ai_consent.mjs
          node tests/test_v014103_first_party_ai_service.mjs
          node tests/test_v014105_reviewed_knowledge_bridge.mjs
          node tests/test_v014107_tutor_quality.mjs
          node tests/test_v014147_tutor_boundary.mjs
          node tests/test_v014147_tutor_history_idempotency.mjs
          node tests/test_v014147_owner_tutor_feedback.mjs
          node tests/test_v014149_tutor_retrieval.mjs
          node tests/test_v014149_tutor_arithmetic.mjs
          node tests/test_v014149_tutor_provider.mjs
          node tests/test_market_tutor_sellable_beta_scope_v1.mjs
          node tests/test_v014149_tutor_conversations.mjs
          node tests/test_v014149_tutor_calculator.mjs
          node tests/test_v014149_tutor_data_export.mjs
          node tests/test_v014149_tutor_editorial_and_gaps.mjs
          node tests/test_tutor_lab_claim_evidence_v1.mjs
          node tests/test_talia_20sources_claim_evaluation_v1.mjs
          node tests/test_talia_academy_source_checkpoint_v1.mjs
          node tests/test_v014149_tutor_lab_context.mjs
          node tests/test_tutor_six_lab_paths.mjs
          node tests/test_tutor_six_lab_route.mjs
          node tests/test_v014159_tutor_verified_followups.mjs
          node tests/test_v014149_tutor_data_delete.mjs
          node tests/test_v014149_tutor_browser_integrity.mjs
          node scripts/deployment09_release_evidence.mjs
          node scripts/dev-program-source-verification.mjs --scope d09
          node --check assets/js/market-tutor.js
          node --check assets/js/admin-tutor-feedback-v014147.js
          node --check functions/api/market-tutor-v01492.js
          node --check functions/api/owner-tutor-feedback.js
          node --check functions/api/member-tutor-history-v014102.js
          node --check functions/_lib/tutor-request-boundary-v014147.js
          node --check functions/_lib/tutor-history-save-v014107.js
          node --check functions/_lib/tutor-provider-v014107.js
          node --check functions/_lib/tutor-retrieval-v014149.js
          node --check functions/_lib/tutor-arithmetic-v014149.js
          node --check functions/api/member-tutor-conversations.js
          node --check functions/api/tutor-calculator.js
          node --check functions/api/member-tutor-data-export.js
          node --check functions/api/market-tutor.js
          node --check functions/api/member-tutor-history.js
          node --check functions/api/member-ai-service.js
          node --check functions/_lib/first-party-ai-service-v014103.js
          node --check functions/_lib/tutor-gaps-v014149.js
          node --check functions/_lib/tutor-lab-context-v014149.js
          node --check functions/_lib/tutor-conversation-context-v014159.js
          node --check functions/_lib/owner-tutor-access-v014149.js
          node --check functions/api/owner-tutor-case.js
          node --check functions/api/owner-tutor-topic-gaps.js
          node --check functions/api/member-tutor-data-delete.js
          bash scripts/build-pages.sh
          test -s public/data/tutor-video-transcript-research-v1.json
          test -s public/data/tutor-guided-practice-v1.json
          test -s public/data/tutor-indicator-study-v1.json
          test -s public/data/tutor-watchlist-study-v1.json
          test -s public/data/tutor-strategy-study-v1.json
          test -s public/assets/js/tutor-guided-practice-v1.js
          test -f public/assets/js/admin-tutor-feedback-v014147.js
          test ! -d public/functions
          test ! -d public/supabase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GU-D09-Tutor-Source-Not-Production-${{ github.run_number }}
          path: |
            artifacts/dev-program-source-verification-d09.json
            artifacts/d09-tutor-source-evidence.json
          if-no-files-found: warn
          retention-days: 30
