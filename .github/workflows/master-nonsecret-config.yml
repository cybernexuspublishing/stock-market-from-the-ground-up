name: Yahoo Master — Public Configuration Parity (No Payments)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-nonsecret-config.yml'
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install independently verified public/test bindings with LIVE switches unchanged
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          node --input-type=module <<'NODE'
          const account='4fe9e562905cf607b6f004d2374299fc',project='stock-market-from-the-ground-up';
          const token=process.env.CF_TOKEN;if(!token||token.length<20)throw Error('Missing master token');
          const origin='https://stock-market-from-the-ground-up-d1r.pages.dev';
          const base='https://api.cloudflare.com/client/v4';
          async function req(method,path,data){
            const r=await fetch(base+path,{method,headers:{authorization:'Bearer '+token,
              ...(data?{'content-type':'application/json'}:{})},body:data?JSON.stringify(data):undefined,signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>({success:false}));
            if(!j.success)throw Error('Cloudflare HTTP '+r.status+' for '+method+' '+path);
            return j.result;
          }
          const a=await req('GET','/accounts/'+account);
          if(a.id!==account||!String(a.name).toLowerCase().includes('yahoo.com'))throw Error('Wrong account');
          const pp='/accounts/'+account+'/pages/projects/'+project;
          const before=await req('GET',pp);
          if(before.id!=='2cf1b496-5f6a-4cb0-89ba-b1519c08154b'||before.subdomain!==new URL(origin).hostname)
            throw Error('Wrong master Pages project');
          const current=before.deployment_configs?.production?.env_vars||{};
          const locked=['GU_PAYMENT_LIVE_LAUNCH_APPROVED','GU58_LIVE_CHECKOUT_ENABLED',
            'GU58_LIVE_WEBHOOK_ENABLED','GU58_LIVE_FULFILLMENT_APPROVED','GU58_LIVE_DB_CONTRACT_APPROVED',
            'GU_F600_LIVE_CHECKOUT_ENABLED','GU_F600_LIVE_WEBHOOK_ENABLED','GU_F600_LIVE_FULFILLMENT_APPROVED',
            'GU72_ZERO_MONTHLY_QA_ENABLED','GU72_ZERO_MONTHLY_FULFILLMENT_ENABLED'];
          if(locked.some(k=>current[k]?.value!=='false'))throw Error('LIVE payment gates not shut');
          const prices={
            'plan:FULL_MONTHLY':'price_1URGlCJY9FI7byHBwlQHq1kz',
            'plan:FULL_ANNUAL':'price_1URGlBJY9FI7byHBW9mcFAh8',
            'plan:LIFETIME':'price_1URGlBJY9FI7byHBa1aFXey2',
            'plan:ONDEMAND_MONTHLY':'price_1URGl6JY9FI7byHBsbDqMilz',
            'tool:INTERACTIVE_LEARNING':'price_1URGlBJY9FI7byHBmr7wkVoI',
            'tool:JOURNAL_ANALYTICS':'price_1URGlAJY9FI7byHBfsRHyUke',
            'tool:MARKET_SIMULATOR':'price_1URGl6JY9FI7byHBnQMqiUVg',
            'tool:MARKET_TUTOR':'price_1URGlAJY9FI7byHBKfqXyyDC'
          };
          if(Object.keys(prices).length!==8)throw Error('Incomplete Sandbox catalog');
          const safe={
            AI_TUTOR_PROVIDER:'cloudflare',
            AI_TUTOR_MODEL:'@cf/zai-org/glm-4.7-flash',
            AI_COST_MODE:'free_only',
            AI_CLOUDFLARE_FREE_TIER_VERIFIED:'false',
            AI_SERVICE_MEMBER_DAILY_LIMIT:'2',
            AI_SERVICE_GLOBAL_DAILY_LIMIT:'5',
            AI_SERVICE_GLOBAL_MONTHLY_LIMIT:'30',
            GU39_STRIPE_TEST_PRICE_MAP_JSON:JSON.stringify(prices),
            GU58_STRIPE_LIVE_ACCOUNT_ID:'acct_1OxhOiJL0O4GGVBH'
          };
          await req('PATCH',pp,{deployment_configs:{production:{
            env_vars:Object.fromEntries(Object.entries(safe).map(([name,value])=>[name,{type:'plain_text',value}]))
          }}});
          const after=await req('GET',pp),v=after.deployment_configs?.production?.env_vars||{};
          if(Object.entries(safe).some(([name,value])=>v[name]?.value!==value))throw Error('Nonsecret settings readback mismatch');
          if(locked.some(k=>v[k]?.value!=='false'))throw Error('LIVE gates changed');
          if(v.TURNSTILE_SECRET_KEY?.type!=='secret_text')throw Error('Existing Turnstile secret lost');
          console.log(JSON.stringify({account,project,safeSettingsAdded:Object.keys(safe).length,
            mappedTestProducts:Object.keys(prices).length,livePaymentGatesOff:true,
            encryptedTurnstilePreserved:true,paymentOperations:0}));
          NODE
