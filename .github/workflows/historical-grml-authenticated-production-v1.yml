name: GRML Genuine Authenticated Historical QA — Noncharging
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/historical-grml-authenticated-production-v1.yml'
      - 'tests/test_historical_grml_authenticated_production_v1.mjs'
      - 'tests/test_historical_grml_authenticated_browser_v1.mjs'
permissions:
  contents: read
concurrency:
  group: grml-authentic-historical-qa
  cancel-in-progress: true
jobs:
  grml-real-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authentic non-impersonated QA suite syntax
        run: |
          node --check tests/test_historical_grml_authenticated_production_v1.mjs
          node --check tests/test_historical_grml_authenticated_browser_v1.mjs
      - name: Genuine pinned QA account historical GRML HTTP lifecycle
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_historical_grml_authenticated_production_v1.mjs
      - name: Install pinned Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Genuine GRML browser Talia and no-lookahead acceptance
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_historical_grml_authenticated_browser_v1.mjs
