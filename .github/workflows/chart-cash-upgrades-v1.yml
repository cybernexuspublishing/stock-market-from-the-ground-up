name: Chart Studio cash upgrades source gate
on:
  push:
    branches: [main]
    paths:
      - 'functions/_lib/chart-cash-test-*.js'
      - 'functions/api/chart-cash-upgrade.js'
      - 'functions/api/chart-tier-access.js'
      - 'functions/api/stripe-test-webhook.js'
      - 'assets/js/store-chart-cash-upgrades-v1.js'
      - 'assets/js/crownlight-chart-tiers-v1.js'
      - 'store.html'
      - 'supabase/migrations/20261031_chart_cash_*.sql'
      - 'tests/test_chart_cash_upgrade_contract_v1.mjs'
      - 'tests/test_crownlight_chart_pass_lifecycle_v5.mjs'
      - 'tests/test_crownlight_chart_workspace_v2.mjs'
      - 'tests/test_crownlight_chart_tiers_v1.mjs'
      - '.github/workflows/chart-cash-upgrades-v1.yml'
  workflow_dispatch:
jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and focused source contracts
        run: |
          node --check functions/_lib/chart-cash-test-v1.js
          node --check functions/_lib/chart-cash-test-webhook-v1.js
          node --check functions/api/chart-cash-upgrade.js
          node --check functions/api/chart-tier-access.js
          node --check functions/api/stripe-test-webhook.js
          node --check assets/js/store-chart-cash-upgrades-v1.js
          node --check assets/js/crownlight-chart-tiers-v1.js
          node tests/test_chart_cash_upgrade_contract_v1.mjs
          node tests/test_crownlight_chart_pass_lifecycle_v5.mjs
          node tests/test_crownlight_chart_workspace_v2.mjs
          node tests/test_crownlight_chart_tiers_v1.mjs
          node tests/test_stripe_test_unified_webhook_20261030.mjs
          node tests/test_crownlight_chart_entitlement_continuity_v4.mjs
          node tests/test_crownlight_chart_studio_v3_integrity.mjs
