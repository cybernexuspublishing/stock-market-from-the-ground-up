name: Membership and Stripe Catalog Contract v0.14.0.35
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/*stripe*.js'
      - 'functions/api/*checkout*.js'
      - 'functions/api/*billing*.js'
      - 'functions/api/payment-catalog-v01433.js'
      - 'tests/test_all_category_owner_catalog_readiness_v1.mjs'
      - 'assets/js/my-purchases.js'
      - 'assets/js/admin-digital-books-v01430.js'
      - 'assets/js/store*.js'
      - 'supabase/migrations/*STRIPE*'
      - 'supabase/migrations/*DIGITAL*'
      - 'tests/test_v014035_*'
      - 'tests/test_v014034_*'
      - 'tests/test_v014033_*'
      - 'tests/test_v014032r2_*'
      - 'scripts/build-pages.sh'
      - '.github/workflows/membership-stripe-contract-v01435.yml'
  pull_request:
    paths:
      - 'functions/api/*stripe*.js'
      - 'functions/api/*checkout*.js'
      - 'functions/api/*billing*.js'
      - 'functions/api/payment-catalog-v01433.js'
      - 'tests/test_all_category_owner_catalog_readiness_v1.mjs'
      - 'assets/js/my-purchases.js'
      - 'assets/js/admin-digital-books-v01430.js'
      - 'assets/js/store*.js'
      - 'supabase/migrations/*STRIPE*'
      - 'supabase/migrations/*DIGITAL*'
      - 'tests/test_v014035_*'
      - 'tests/test_v014034_*'
      - 'tests/test_v014033_*'
      - 'tests/test_v014032r2_*'
      - 'scripts/build-pages.sh'
      - '.github/workflows/membership-stripe-contract-v01435.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review membership and ebook rights source
        run: python tests/test_v014035_membership_stripe_source.py
      - name: Existing payment contract regressions
        run: |
          python tests/test_v014034_admin_accessibility.py
          python tests/test_v014033_payment_source.py
          node tests/test_v014032r2_stripe_sandbox.mjs
      - name: Verify all-category Owner catalogue is read-only and fail-closed
        run: node tests/test_all_category_owner_catalog_readiness_v1.mjs
      - name: Verify Cloudflare Pages boundary
        run: |
          bash scripts/build-pages.sh
          test ! -e public/supabase
          test ! -e public/functions
          test ! -e public/tests
