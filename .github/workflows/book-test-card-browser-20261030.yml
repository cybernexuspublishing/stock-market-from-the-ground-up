name: Genuine Stripe TEST Card Book Purchase QA
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_book_test_card_browser_20261030.mjs'
      - '.github/workflows/book-test-card-browser-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-test-card:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Authenticate QA member and pay in Stripe TEST Checkout
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_book_test_card_browser_20261030.mjs
