name: Verified Replay Integration v0.14.0.93
on:
  push:
    branches: [main]
    paths:
      - 'functions/api/learning-replay-v01492.js'
      - 'functions/_lib/owner-lab-readiness-v01493.js'
      - 'functions/_lib/replay-engine-v01492.js'
      - 'tests/test_v014093_execution_price_bounds.mjs'
      - 'assets/js/verified-replay-v01492.js'
      - 'verified-replay.html'
      - 'tests/test_v014093_replay_catalog_resume.mjs'
      - 'tests/test_v014094_replay_journal_link.mjs'
      - 'supabase/migrations/v0.14.0.94_REPLAY_JOURNAL_ATOMIC_OWNER_REVIEW_REQUIRED.sql'
      - 'supabase/admin/v0.14.0.94_REPLAY_JOURNAL_PREFLIGHT_READ_ONLY.sql'
      - 'tests/test_v014092_replay_contract.mjs'
      - '.github/workflows/verified-replay-resume-v01493.yml'
      - 'functions/_lib/owner-lab-readiness-v01493.js'
      - 'functions/api/owner-roadmap.js'
      - 'assets/js/owner-roadmap-product-readiness-v01491.js'
      - 'assets/js/owner-roadmap.js'
      - 'owner-roadmap.html'
      - 'tests/test_v014093_owner_lab_readiness.mjs'
      - 'functions/api/market-tutor-v01492.js'
      - 'assets/js/market-tutor.js'
      - 'market-tutor.html'
      - 'tests/test_v014093_tutor_practice.mjs'
  pull_request:
    paths:
      - 'functions/api/learning-replay-v01492.js'
      - 'assets/js/verified-replay-v01492.js'
      - 'verified-replay.html'
      - 'tests/test_v014093_replay_catalog_resume.mjs'
      - 'tests/test_v014094_replay_journal_link.mjs'
      - 'supabase/migrations/v0.14.0.94_REPLAY_JOURNAL_ATOMIC_OWNER_REVIEW_REQUIRED.sql'
      - 'supabase/admin/v0.14.0.94_REPLAY_JOURNAL_PREFLIGHT_READ_ONLY.sql'
      - '.github/workflows/verified-replay-resume-v01493.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and regression contracts
        run: |
          node --check functions/api/learning-replay-v01492.js
          node --check assets/js/verified-replay-v01492.js
          node tests/test_v014092_replay_contract.mjs
          node tests/test_v014093_replay_catalog_resume.mjs
          node tests/test_v014094_replay_journal_link.mjs
          node tests/test_v014093_execution_price_bounds.mjs
          node --check functions/_lib/owner-lab-readiness-v01493.js
          node --check assets/js/owner-roadmap-product-readiness-v01491.js
          node tests/test_v014093_owner_lab_readiness.mjs
          node --check functions/api/market-tutor-v01492.js
          node --check assets/js/market-tutor.js
          node tests/test_v014092_market_tutor_contract.mjs
          node tests/test_v014093_tutor_practice.mjs
      - name: Confirm server boundary, build exclusion and no release promotion
        run: |
          bash scripts/build-pages.sh
          test -f public/verified-replay.html
          test -f public/assets/js/verified-replay-v01492.js
          test ! -e public/functions
          test ! -e public/supabase
          test ! -e public/tests
