name: Stripe Shadow Sandbox v0.14.0.54
on:
  push:
    paths:
      - 'functions/api/gu39-*.js'
      - 'supabase/migrations/v0.14.0.39*'
      - 'assets/js/admin-stripe-shadow-v01439.js'
      - 'assets/js/admin-simple-navigation-v014036.js'
      - 'tests/test_v01439_*'
      - 'tests/test_v014040_*'
      - 'tests/test_v014041_*'
      - 'functions/api/stripe-product-readiness-v01437.js'
      - 'assets/js/site.js'
      - 'admin.html'
      - 'assets/js/admin-payment-center-v01433.js'
      - 'assets/js/admin-simple-navigation-v014036.js'
      - 'tests/test_v014042_*'
      - 'tests/test_v014043_*'
      - 'tests/v0.14.0.47_*'
      - 'tests/test_v014049_*'
      - 'tests/test_v014051_*'
      - 'tests/test_v014052_*'
      - 'tests/test_v014053_*'
      - 'tests/test_v014054_*'
      - 'supabase/admin/v0.14.0.49*'
      - 'supabase/admin/v0.14.0.40*'
      - 'tests/test_v014032r2_payment_source.py'
      - '.github/workflows/stripe-shadow-v01439.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sandbox source and entitlements isolation
        run: python tests/test_v01439_source.py
      - name: Mock signed Stripe TEST checkout and shadow event
        run: |
          node tests/test_v01439_cloudflare_mock.mjs
          node tests/test_v014049_shadow_guard.mjs
          node tests/test_v014049_release_gate.mjs
          node tests/test_v014051_payment_readiness.mjs
          node tests/test_v014053_owner_toggle_stepup.mjs
          node tests/test_v014054_checkout_safety.mjs
      - name: Verify v40 catalog checks and secret-key compatibility
        run: node tests/test_v014040_catalog_and_auth.mjs
      - name: Unified Stripe catalog v41 regressions
        run: |
          node tests/test_v014037_stripe_readiness.mjs
          node tests/test_v014041_unified_catalog.mjs
          node tests/test_v014043_stripe_error_contract.mjs
          node tests/v0.14.0.47_STRIPE_ROLE_FACADE.mjs
      - name: Admin UI browser smoke test
        run: |
          python -m pip install playwright==1.56.0
          sudo apt-get update -qq
          sudo apt-get install -y chromium >/dev/null
          python tests/test_v01439_admin_browser.py
          python tests/test_v014052_admin_payment_bundle.py
          python tests/test_v014053_admin_owner_stepup.py
          python tests/test_v014054_checkout_audit_browser.py
          python tests/test_v014042_admin_visibility.py
