name: Scanner Watchlist Catalyst & BYO Market Rights v0.14.0.145
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  researcher-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 16 canonical tools, private workspaces, scanner filtering, math and BYO tokens
        run: |
          node tests/test_stt_sitewide_reconciliation_v1.mjs
          node tests/test_advanced_trade_plan_builder_v1.mjs
          node tests/test_trade_plan_order_lifecycle_v1.mjs
          node tests/test_chart_plan_levels_v1.mjs
          node tests/test_sec_issuer_research_v1.mjs
          node tests/test_trade_plan_snapshot_api_v1.mjs
          node tests/test_shared_product_access_config_v1.mjs
          node --check functions/_lib/product-access-config-v1.js
          node --check functions/api/product-access-config.js
          node --check assets/js/admin-product-access-v1.js
          node tests/test_v014110_advanced_tool_access_and_workspace.mjs
          node tests/test_v014111_tool_math_boundaries.mjs
          node tests/test_v014145_research_scanner.mjs
          node tests/test_v014145_marketdata_byo_security.mjs
          node tests/test_v014150_market_data_integrity.mjs
          node tests/test_member_alpaca_market_data_v1.mjs
          node tests/test_crownlight_chart_studio_v2.mjs
          node --check assets/js/crownlight-indicator-math-v2.js
          node --check assets/js/crownlight-chart-studio-v2.js
          node --check functions/api/credentials.js
          node tests/test_v014150_market_bar_import.mjs
          node tests/test_v014150_scanner_filters.mjs
          node tests/test_v014150_indicator_math.mjs
          node tests/test_v014150_watchlist_lifecycle.mjs
          node tests/test_v014150_pattern_evidence.mjs
          node tests/test_v014150_session_levels.mjs
          node --check functions/_lib/market-data-integrity-v014150.js
          node --check functions/api/marketdata.js
          node --check assets/js/advanced-tools.js
          node --check assets/js/market-bars-import-v014150.js
          node --check assets/js/market-research-engine-v014145.js
          bash scripts/build-pages.sh
          test -f public/assets/js/market-research-engine-v014145.js
          test -f public/advanced-tool.html
          test -f public/assets/js/market-bars-import-v014150.js
          test ! -e public/supabase
          test ! -d public/functions
