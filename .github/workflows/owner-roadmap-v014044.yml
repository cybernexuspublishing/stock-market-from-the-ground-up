name: Owner Website Roadmap + Sitewide Audit v0.14.0.44
on:
  pull_request:
    paths:
      - 'owner-roadmap.html'
      - 'assets/css/owner-roadmap.css'
      - 'assets/js/owner-roadmap.js'
      - 'assets/js/navigation.js'
      - 'assets/js/route-policy.js'
      - 'functions/api/owner-roadmap.js'
      - 'functions/_lib/owner-roadmap-catalog.js'
      - 'tests/test_owner_roadmap_v014044.py'
      - 'scripts/build-pages.sh'
      - 'assets/js/turnstile-auth.js'
      - 'assets/js/signup.js'
      - 'signin.html'
      - 'create-account.html'
      - 'tests/test_v01438_auth_single_widget.py'
      - '.github/workflows/owner-roadmap-v014044.yml'
  push:
    branches: [main]
    paths:
      - 'owner-roadmap.html'
      - 'assets/css/owner-roadmap.css'
      - 'assets/js/owner-roadmap.js'
      - 'assets/js/navigation.js'
      - 'assets/js/route-policy.js'
      - 'functions/api/owner-roadmap.js'
      - 'functions/_lib/owner-roadmap-catalog.js'
      - 'tests/test_owner_roadmap_v014044.py'
      - 'scripts/build-pages.sh'
jobs:
  roadmap-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify requirements and access contract
        run: python3 tests/test_owner_roadmap_v014044.py
      - name: Verify manually initiated Turnstile login flow in Chromium
        run: |
          python -m pip install playwright==1.56.0 beautifulsoup4
          sudo apt-get update -qq
          sudo apt-get install -y chromium >/dev/null
          python tests/test_v01438_auth_single_widget.py
      - name: Inventory HTML pages, JavaScript, CSS, links and accessibility review flags
        run: |
          mkdir -p artifacts
          python scripts/audit_frontend.py . artifacts/v01444-sitewide-static-audit.json
          node --check assets/js/turnstile-auth.js
          node --check assets/js/signup.js
          node --check assets/js/owner-roadmap.js
      - name: Publish source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-roadmap-v01444-static-audit
          path: artifacts/v01444-sitewide-static-audit.json
          if-no-files-found: warn
      - name: Verify Cloudflare Pages build
        run: bash scripts/build-pages.sh
      - name: Ensure private catalog not publicly deployed
        run: |
          test -f public/owner-roadmap.html
          test -f public/assets/js/owner-roadmap.js
          test -f public/assets/css/owner-roadmap.css
          test ! -e public/functions/_lib/owner-roadmap-catalog.js
          test ! -e public/functions/api/owner-roadmap.js
          test ! -e public/docs/sitewide/REQUIREMENTS_REGISTER.csv
