name: Owner Store Acceptance v0.14.0.180
on:
  push:
    branches: [main]
    paths:
      - "functions/api/admin.js"
      - "functions/api/store-product-overrides.js"
      - "assets/js/admin-product-catalog-v014175.js"
      - "assets/js/store-inventory-ui-v014174.js"
      - "assets/js/store-inventory-v014174.js"
      - "tests/test_v01417*.mjs"
      - "tests/test_v014180_owner_store_acceptance.mjs"
      - "tests/test_member_sparks_wallet_v014296.mjs"
      - "tests/test_owner_store_categories_gallery_v014300.mjs"
      - "tests/test_owner_background_and_stripe_map_v1.mjs"
      - "tests/test_book_uploader_and_learning_header_v1.mjs"
      - "tests/test_admin_password_modal_top_layer_v1.mjs"
      - "tests/test_private_book_owner_preview_v1.mjs"
      - "functions/api/digital-book-owner-preview-v1.js"
      - "assets/js/admin-password-confirm-v01432r1.js"
      - "assets/css/admin-password-confirm-v01432r1.css"
      - "assets/js/admin-digital-books-v01430.js"
      - "assets/css/focused-learning-header-v1.css"
      - "assets/js/admin-site-background-v1.js"
      - "assets/js/site-background-v1.js"
      - "functions/api/website-design.js"
      - "functions/api/payment-catalog-v01433.js"
      - "assets/js/admin-store-categories-v014297.js"
      - "assets/js/admin-store-photos-v014300.js"
      - "assets/js/store-product-gallery-v014300.js"
      - "assets/js/site.js"
      - "admin.html"
      - "functions/api/member-sparks-wallet.js"
      - "assets/js/navigation.js"
      - "assets/js/store.js"
      - "store.html"
      - "store-sparks.html"
      - "dashboard.html"
      - ".github/workflows/owner-store-acceptance-v014180.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-store-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Main catalog and release boundaries
        run: |
          node tests/test_v014174_unified_storefront_inventory.mjs
          node tests/test_v014175_admin_prelaunch_inventory.mjs
          node tests/test_v014175_owner_product_overlays.mjs
          node tests/test_v014176_product_seed_and_owner_editor.mjs
          node tests/test_v014179_store_visibility_contract.mjs
          node tests/test_v014180_owner_store_acceptance.mjs
          node tests/test_member_sparks_wallet_v014296.mjs
          node tests/test_owner_store_categories_gallery_v014300.mjs
          node tests/test_owner_background_and_stripe_map_v1.mjs
          node tests/test_book_uploader_and_learning_header_v1.mjs
          node tests/test_admin_password_modal_top_layer_v1.mjs
          node tests/test_private_book_owner_preview_v1.mjs
          node tests/test_v014033_payment_catalog.mjs
          node --check assets/js/admin-store-categories-v014297.js
          node --check assets/js/admin-store-photos-v014300.js
          node --check assets/js/store-product-gallery-v014300.js
          node --check functions/api/member-sparks-wallet.js
          node --check assets/js/navigation.js
          node --check assets/js/store.js
          node --check assets/js/store-inventory-ui-v014174.js
          bash scripts/build-pages.sh
          test -f public/store-sparks.html
          test -f public/data/crownlight-sparks-store-v014167.json
          test ! -d public/functions
