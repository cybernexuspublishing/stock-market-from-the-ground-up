name: Backend Contract v0.14.0.25
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel obsolete push checks, preserve isolated manual/explicit reruns.
concurrency:
  group: backend-source-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
jobs:
  case-audit-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Security and regression source contracts
        run: |
          python tests/test_v014025_release.py
          python tests/test_v014024_release.py
          python tests/test_v014023_backend.py
          python tests/test_v014022_release_gate.py
      - name: Caller-scoped audited case history API tests
        run: |
          node tests/test_v014025_history_api.mjs
          node tests/test_v014024_cases_api.mjs
      - name: Prepare browser integration runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: 'Isolated browser: moderation and safe history rendering'
        run: |
          python tests/test_v014024_browser.py
          python tests/test_v014025_browser.py
      - name: Static publication security boundary
        run: |
          bash scripts/build-pages.sh
          test ! -e public/functions
          test ! -e public/supabase
          test ! -e public/tests
          test ! -e public/data/interactive-labs.json
