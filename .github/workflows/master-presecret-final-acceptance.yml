name: Yahoo Master — Final Before-Secrets Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-presecret-final-acceptance.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 40-variable presecret baseline and inactive Worker without credential values
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          node --input-type=module <<'NODE'
          const account='4fe9e562905cf607b6f004d2374299fc',project='stock-market-from-the-ground-up',token=process.env.CF_TOKEN;
          if(!token||token.length<20)throw Error('Missing master Cloudflare token');
          async function get(path){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{
              authorization:'Bearer '+token},signal:AbortSignal.timeout(18000)});
            const d=await r.json().catch(()=>({success:false}));
            if(!d.success)throw Error('Cloudflare GET HTTP '+r.status);
            return d.result;
          }
          const [acct,p,c,s]=await Promise.all([
            get('/accounts/'+account),
            get('/accounts/'+account+'/pages/projects/'+project),
            get('/accounts/'+account+'/workers/scripts/ground-up-billing-scheduler/schedules'),
            get('/accounts/'+account+'/workers/scripts/ground-up-billing-scheduler/subdomain')
          ]);
          if(acct.id!==account||p.id!=='2cf1b496-5f6a-4cb0-89ba-b1519c08154b')
            throw Error('Wrong production master');
          const v=p.deployment_configs?.production?.env_vars||{};
          const blockers=['SUPABASE_SECRET_KEY','GU39_STRIPE_TEST_SECRET_KEY',
            'GU39_STRIPE_TEST_WEBHOOK_SECRET','GU58_STRIPE_LIVE_SECRET_KEY',
            'GU58_STRIPE_LIVE_WEBHOOK_SECRET','GU_F600_LIVE_WEBHOOK_SECRET'];
          const missing=blockers.filter(k=>v[k]?.type!=='secret_text');
          const switches=['GU_PAYMENT_LIVE_LAUNCH_APPROVED','GU58_LIVE_CHECKOUT_ENABLED',
            'GU58_LIVE_WEBHOOK_ENABLED','GU58_LIVE_DB_CONTRACT_APPROVED',
            'GU58_LIVE_FULFILLMENT_APPROVED','GU_F600_LIVE_CHECKOUT_ENABLED',
            'GU_F600_LIVE_WEBHOOK_ENABLED','GU_F600_LIVE_FULFILLMENT_APPROVED',
            'GU72_ZERO_MONTHLY_QA_ENABLED','GU72_ZERO_MONTHLY_FULFILLMENT_ENABLED',
            'ENABLE_SHOWCASE_CREATION_V135','ENABLE_BOOK_CATALOG_EDITS_V135'];
          if(switches.some(k=>v[k]?.value!=='false'))throw Error('Production switch safety violated');
          if(Object.keys(v).length!==40||missing.length!==6)
            throw Error('Unexpected presecret inventory: variable count/missing secrets changed');
          if(v.TURNSTILE_SECRET_KEY?.type!=='secret_text'||v.GU_BILLING_TASK_SECRET?.type!=='secret_text')
            throw Error('Encrypted existing master bindings lost');
          if(p.source?.config?.preview_deployment_setting!=='none'||p.source?.type!=='github'||
            p.source?.config?.production_deployments_enabled!==true||
            p.production_branch!=='main')throw Error('Incorrect GitHub deployment setup');
          if((c.schedules||[]).length||s.enabled!==false||s.previews_enabled!==false)
            throw Error('Master billing Worker accidentally active');
          console.log(JSON.stringify({masterAccountVerified:true,productionPages:true,
            countOfNonsecretBindings:40,expectedMissingEncryptedSecrets:missing,
            uncheckedPrivateQaUserId:!v.GU72_QA_ALLOWED_USER_ID,
            safetySwitchesOff:switches.length,
            existingEncryptedTurnstileAndBillingBindingsPreserved:true,
            masterWorkerCrons:0,masterWorkerPublic:false,livePaymentOperations:0},null,2));
          NODE
      - name: Recheck public site and negative security contracts (GET only)
        run: node tests/cloudflare-master-smoke.mjs
