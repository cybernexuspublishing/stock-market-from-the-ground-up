name: Historical Replay Classroom V1
on:
  push:
    branches: [main]
    paths:
      - 'assets/js/historical-replay-classroom-v1.js'
      - 'assets/js/historical-grml-talia-v1.js'
      - 'tests/test_historical_grml_talia_v1.mjs'
      - 'assets/js/verified-replay-v01492.js'
      - 'assets/js/crownlight-chart-studio-v2.js'
      - 'assets/js/learning.js'
      - 'functions/api/learning-replay-v01492.js'
      - 'functions/api/ondemand-training.js'
      - 'verified-replay.html'
      - 'ondemand-training.html'
      - 'assets/css/historical-replay-classroom-v1.css'
      - 'docs/research/HISTORICAL_REPLAY_78_SOURCE_CANDIDATES_20261028.csv'
      - 'tests/test_historical_replay_classroom_v1.mjs'
      - 'tests/test_historical_replay_classroom_browser_v1.mjs'
      - 'tests/test_historical_training_catalog_browser_v1.mjs'
      - 'tests/test_historical_replay_78_source_registry_v1.mjs'
      - 'tests/test_historical_replay_all89_v1.mjs'
      - 'docs/research/HISTORICAL_REPLAY_ALL_89_SOURCE_CANDIDATES_20261028.csv'
      - '.github/workflows/historical-replay-classroom-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classroom-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check assets/js/historical-replay-classroom-v1.js
          node --check assets/js/historical-grml-talia-v1.js
          node --check assets/js/verified-replay-v01492.js
          node --check assets/js/crownlight-chart-studio-v2.js
          node --check assets/js/learning.js
          node --check functions/api/learning-replay-v01492.js
          node --check functions/api/ondemand-training.js
          node tests/test_historical_replay_classroom_v1.mjs
          node tests/test_historical_grml_talia_v1.mjs
          node tests/test_historical_replay_78_source_registry_v1.mjs
          node tests/test_historical_replay_all89_v1.mjs
  classroom-browser:
    needs: classroom-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned open-source Chromium test tooling
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 lightweight-charts@5.2.1
          npx playwright install --with-deps chromium
      - name: Browser-level no-lookahead and Talia lesson flow (mock data, no private credentials)
        run: |
          node tests/test_historical_replay_classroom_browser_v1.mjs
          node tests/test_historical_training_catalog_browser_v1.mjs
