name: Display preferences and philosophy QA
on:
  push:
    branches: [main]
    paths: ['assets/js/display-preferences.js', 'assets/css/display-preferences.css', 'functions/api/ui-state.js', 'philosophy.html', 'tests/test_display_preferences*.mjs', 'tests/test_dashboard_display_settings_browser.mjs', 'assets/js/dashboard-ui-legacy.js', 'tests/test_sitewide_appearance_live.mjs', '.github/workflows/display-preferences-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_display_preferences_model.mjs
      - run: node tests/test_display_preferences_api.mjs
      - run: node tests/test_display_preferences.mjs
      - run: node tests/test_dashboard_display_settings_browser.mjs
      - run: bash scripts/build-pages.sh
  sitewide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Wait for philosophy and shared display deployment
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<60;i++){
            const response=await fetch('https://stock-market-from-the-ground-up-d1r.pages.dev/philosophy?qa='+Date.now());
            const body=await response.text();
            if(response.ok&&body.includes('display-preferences.js')&&body.includes('Your checkpoint:')){ready=true;break;}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw Error('Deployment not ready for visual audit');
          JS
      - run: node tests/test_sitewide_appearance_live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-appearance-report
          path: artifacts/sitewide-appearance/
