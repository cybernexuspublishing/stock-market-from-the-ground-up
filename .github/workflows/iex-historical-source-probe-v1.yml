name: IEX HIST May 2024 Bounded Source Acquisition — Quarantine
on:
  push:
    branches: [main]
    paths:
      - 'scripts/market-data/iex_historical_archive_probe.py'
      - 'scripts/market-data/pcapng_iex_reader.py'
      - 'tests/test_iex_historical_pcapng_reader_v1.py'
      - '.github/workflows/iex-historical-source-probe-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iex-quarantine-20240507-source-probe
  cancel-in-progress: true
jobs:
  capture-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate downloader and existing IEX protocol parser
        run: |
          python -m py_compile scripts/market-data/iex_historical_archive_probe.py scripts/market-data/iex_tops.py scripts/market-data/pcapng_iex_reader.py
          python tests/test_iex_historical_pcapng_reader_v1.py
      - name: Read only official IEX archive; capture first 30 minutes for six historical cases
        run: |
          mkdir -p /tmp/iex-hist-quarantine
          python scripts/market-data/iex_historical_archive_probe.py \
            --date 2024-05-07 \
            --tickers BAC,CVNA,DIS,F,GPRO,RIVN \
            --minutes 30 \
            --max-compressed-mib 256 \
            --output /tmp/iex-hist-quarantine/20240507_source_probe.json
      - name: Preserve audit evidence privately and temporarily; NOT published to website
        uses: actions/upload-artifact@v4
        with:
          name: iex-hist-20240507-quarantine-evidence
          path: /tmp/iex-hist-quarantine/20240507_source_probe.json
          retention-days: 3
          if-no-files-found: error
