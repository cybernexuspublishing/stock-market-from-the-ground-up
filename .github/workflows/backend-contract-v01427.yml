name: Backend Contract v0.14.0.27
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audited-backend-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser for complete workflow syntax validation
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate source version, audit SQL and all GitHub workflow YAML
        run: python tests/test_v014027_release.py
      - name: Preserve production static-build privacy boundaries
        run: |
          bash scripts/build-pages.sh
          test ! -e public/supabase
          test ! -e public/functions
          test ! -e public/tests
          test ! -e public/data/interactive-labs.json
