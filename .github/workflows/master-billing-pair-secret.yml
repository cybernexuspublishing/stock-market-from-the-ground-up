name: Master Billing — Inactive Secret Pair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-deploy inactive Worker with master-only endpoint and zero crons
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: '4fe9e562905cf607b6f004d2374299fc'
          CI: 'true'
        run: npx --yes wrangler@4.152.0 deploy --config workers/wrangler-master-billing.jsonc
      - name: Generate master-exclusive billing secret and encrypt in Pages and Worker
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          node --input-type=module <<'NODE'
          import {randomBytes} from 'node:crypto';
          const acct='4fe9e562905cf607b6f004d2374299fc',
            name='ground-up-billing-scheduler',project='stock-market-from-the-ground-up';
          const secretName='GU_BILLING_TASK_SECRET';
          const tok=process.env.CF_TOKEN;
          if(!tok||tok.length<20)throw Error('Cloudflare authorization unavailable');
          const apiRoot='https://api.cloudflare.com/client/v4';
          async function api(method,path,payload){
            const response=await fetch(apiRoot+path,{method,headers:{authorization:'Bearer '+tok,
                ...(payload?{'content-type':'application/json'}:{})},
              body:payload?JSON.stringify(payload):undefined,signal:AbortSignal.timeout(20000)});
            const result=await response.json().catch(()=>({success:false}));
            if(!result.success)throw Error('Cloudflare '+method+' request failed: HTTP '+response.status);
            return result.result;
          }
          const a=await api('GET','/accounts/'+acct);
          if(a.id!==acct||!String(a.name).toLowerCase().includes('yahoo.com'))throw Error('Wrong account');
          const wp='/accounts/'+acct+'/workers/scripts/'+name;
          const cron=await api('GET',wp+'/schedules');
          if((cron.schedules||[]).length!==0)throw Error('Active scheduler: refusing secret change');
          const sub=await api('GET',wp+'/subdomain');
          if(sub.enabled!==false||sub.previews_enabled!==false)throw Error('Worker exposed publicly');
          const pp='/accounts/'+acct+'/pages/projects/'+project;
          const pages=await api('GET',pp);
          const env=pages.deployment_configs?.production?.env_vars||{};
          if(env.GU_PAYMENT_LIVE_LAUNCH_APPROVED?.value!=='false')
            throw Error('LIVE launch gate unsafe');
          if(env.GU_BILLING_SITE_ORIGIN?.value!=='https://stock-market-from-the-ground-up-d1r.pages.dev')
            throw Error('Unexpected billing target origin');
          const bindings=await api('GET',wp+'/secrets');
          const workerHas=Array.isArray(bindings)&&bindings.some(s=>s.name===secretName);
          const pagesHas=env[secretName]?.type==='secret_text';
          if(workerHas&&pagesHas){
            console.log('Master billing secret bindings already present in both locations; not rotating.');
          }else{
            // No secret value is committed, printed or sent to a third party.
            const val=randomBytes(48).toString('base64url');
            await api('PUT',wp+'/secrets',{name:secretName,text:val,type:'secret_text'});
            await api('PATCH',pp,{deployment_configs:{production:{
              env_vars:{[secretName]:{type:'secret_text',value:val}}
            }}});
            console.log('New master-only secret generated and encrypted in both components.');
          }
          const finalPages=await api('GET',pp);
          const finalSecrets=await api('GET',wp+'/secrets');
          const finalCrons=await api('GET',wp+'/schedules');
          if(finalPages.deployment_configs?.production?.env_vars?.[secretName]?.type!=='secret_text'
             ||!Array.isArray(finalSecrets)||!finalSecrets.some(s=>s.name===secretName)
             ||(finalCrons.schedules||[]).length!==0)
            throw Error('Master billing secret pair verification failed');
          console.log(JSON.stringify({masterAccount:acct,worker:name,
            pagesEncryptedSecret:true,workerEncryptedSecret:true,cronCount:0,
            workersDevEnabled:false,livePaymentTests:0}));
          NODE
