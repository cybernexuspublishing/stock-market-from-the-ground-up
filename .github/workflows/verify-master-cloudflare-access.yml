name: Verify Master Cloudflare Credential (Read Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-master-cloudflare-access.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify saved credential reaches exact Yahoo master account (GET only)
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
          MASTER_ACCOUNT_ID: '4fe9e562905cf607b6f004d2374299fc'
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN,accountId=process.env.MASTER_ACCOUNT_ID;
          if(!token || token.length<20){console.error('GitHub Cloudflare deployment secret missing.');process.exit(1)}
          const get=async path=>{
            const response=await fetch('https://api.cloudflare.com/client/v4'+path,{method:'GET',
              headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
            const body=await response.json().catch(()=>({success:false}));
            return {status:response.status,success:body.success===true,result:body.result};
          };
          const a=await get('/accounts/'+accountId);
          const authorized=a.success&&a.result?.id===accountId;
          console.log('Expected master account ID:',accountId);
          console.log('GET master account:',authorized?'AUTHORIZED':'UNAUTHORIZED','HTTP '+a.status);
          if(authorized) console.log('Master account:',a.result.name);
          if(!authorized)process.exit(1);
          const pages=await get('/accounts/'+accountId+'/pages/projects');
          console.log('Master Pages project read:',pages.success?'OK':'UNAVAILABLE','HTTP '+pages.status);
          if(pages.success&&Array.isArray(pages.result))
            console.log('Existing Pages projects:',JSON.stringify(pages.result.map(p=>({name:p.name,source:p.source?.type,branch:p.production_branch}))));
          if(!pages.success)process.exitCode=1;
          const target='stock-market-from-the-ground-up';
          const p=await get('/accounts/'+accountId+'/pages/projects/'+target);
          console.log('Master Pages project detail:',p.success?'OK':'UNAVAILABLE','HTTP '+p.status);
          if(p.success){
            const x=p.result||{},v=x.deployment_configs?.production?.env_vars||{};
            console.log('Master project configuration:',JSON.stringify({
              id:x.id,name:x.name,subdomain:x.subdomain,production_branch:x.production_branch,
              build_command:x.build_config?.build_command,output_dir:x.build_config?.destination_dir,
              source_type:x.source?.type,github_repo:x.source?.config?.repo_name,
              latest_deployment:x.latest_deployment&&{id:x.latest_deployment.id,status:x.latest_deployment.latest_stage?.status,url:x.latest_deployment.url},
              configured_variable_names:Object.keys(v),
              live_approval:v.GU_PAYMENT_LIVE_LAUNCH_APPROVED?.type==='plain_text'?v.GU_PAYMENT_LIVE_LAUNCH_APPROVED.value:null
            }));
          }
          const deployments=await get('/accounts/'+accountId+'/pages/projects/'+target+'/deployments');
          console.log('Master deployment inventory:',deployments.success?'OK':'UNAVAILABLE','HTTP '+deployments.status);
          if(deployments.success&&Array.isArray(deployments.result))
            console.log('Recent deployments:',JSON.stringify(deployments.result.slice(0,4).map(x=>({id:x.id,status:x.latest_stage?.status,created:x.created_on,url:x.url}))));
          const interim=await get('/accounts/9a43bc08e9db72e7187bc8c0a31710c2/pages/projects/stock-market-from-the-ground-up-lives');
          console.log('Interim account source-config access:',interim.success?'AUTHORIZED':'UNAVAILABLE','HTTP '+interim.status);
          if(interim.success){
            const e=interim.result?.deployment_configs?.production?.env_vars||{};
            console.log('Interim production variable counts:',JSON.stringify({
              plain_text:Object.values(e).filter(v=>v.type==='plain_text').length,
              secret_text:Object.values(e).filter(v=>v.type==='secret_text').length
            }));
          }
          const turnstile=await get('/accounts/'+accountId+'/challenges/widgets');
          console.log('Master Turnstile widget inventory:',turnstile.success?'AUTHORIZED':'UNAVAILABLE','HTTP '+turnstile.status);
          if(turnstile.success&&Array.isArray(turnstile.result))
            console.log('Existing managed widget names:',JSON.stringify(turnstile.result.map(x=>({name:x.name,domains:x.domains}))));
          if(!p.success||!deployments.success)process.exitCode=1;
          NODE
