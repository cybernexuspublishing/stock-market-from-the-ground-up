name: Verify Master Cloudflare Credential (Read Only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-master-cloudflare-access.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify saved Cloudflare key without deployment or writes
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token || token.length < 20) {
            console.error('GitHub secret SMFGU_LIVES_PAGES_DEPLOY is missing or invalid.');
            process.exit(1);
          }
          const get=async path=>{
            const response=await fetch('https://api.cloudflare.com/client/v4'+path,{
              method:'GET',headers:{Authorization:'Bearer '+token},
              signal:AbortSignal.timeout(15000)
            });
            const body=await response.json().catch(()=>({success:false}));
            return {http:response.status,success:body.success===true,data:body.result};
          };
          const verify=await get('/user/tokens/verify');
          console.log('Token verification:',verify.success?'VALID':'UNVERIFIED','HTTP',verify.http);
          const accounts=await get('/accounts?page=1&per_page=50');
          console.log('Account enumeration:',accounts.success?'SUCCEEDED':'FAILED','HTTP',accounts.http);
          if(accounts.success && Array.isArray(accounts.data)){
            for(const a of accounts.data){
              console.log('Account:',JSON.stringify({id:a.id,name:a.name,type:a.type}));
            }
          }
          if(!verify.success || !accounts.success)process.exitCode=1;
          NODE
