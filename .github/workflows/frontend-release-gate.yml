name: Frontend Source Contract Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical frontend features against the ACTIVE release
        run: |
          python tests/test_v014018_overlay.py
          python tests/test_v014019_frontend.py
          node tests/test_v014019_mentions.mjs
          node tests/test_home_member_echarts_v1.mjs
          node tests/test_teaching_full_width_v1.mjs
      - name: Verify current frontend/backend integration source contracts
        run: |
          python tests/test_v014022_release_gate.py
          node tests/test_v014020_backend_api.mjs
          node tests/test_v014021_subscription_api.mjs
          python tests/test_v014021_backend_contracts.py
      - name: Preserve Cloudflare Pages public/private build boundary
        run: |
          bash scripts/build-pages.sh
          test ! -e public/data/interactive-labs.json
          test ! -d public/supabase
          test ! -d public/functions
          test ! -d public/tests
          test ! -e public/PROJECT_MANIFEST.json
