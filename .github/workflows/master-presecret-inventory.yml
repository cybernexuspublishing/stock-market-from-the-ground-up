name: Yahoo Master — Presecret Inventory (GET Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inventory master bindings and safe deployment state
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          node --input-type=module <<'NODE'
          const account='4fe9e562905cf607b6f004d2374299fc';
          const project='stock-market-from-the-ground-up';
          const baseline=["AI_CLOUDFLARE_FREE_TIER_VERIFIED","AI_CLOUDFLARE_MODEL_LICENSE_APPROVED","AI_COST_MODE","AI_PAID_PROVIDER_OWNER_APPROVED","AI_SERVICE_ENABLED","AI_SERVICE_GLOBAL_DAILY_LIMIT","AI_SERVICE_GLOBAL_MONTHLY_LIMIT","AI_SERVICE_MEMBER_DAILY_LIMIT","AI_TUTOR_MODEL","AI_TUTOR_PROVIDER","ENABLE_BOOK_CATALOG_EDITS_V135","ENABLE_SHOWCASE_CREATION_V135","ENFORCE_AUTH_TURNSTILE_V135","GU39_SANDBOX_SHADOW_GATE","GU39_STRIPE_TEST_PRICE_MAP_JSON","GU39_STRIPE_TEST_SECRET_KEY","GU39_STRIPE_TEST_WEBHOOK_SECRET","GU58_LIVE_CHECKOUT_ENABLED","GU58_LIVE_DB_CONTRACT_APPROVED","GU58_LIVE_FULFILLMENT_APPROVED","GU58_LIVE_WEBHOOK_ENABLED","GU58_STRIPE_LIVE_ACCOUNT_ID","GU58_STRIPE_LIVE_CATALOG_JSON","GU58_STRIPE_LIVE_SECRET_KEY","GU58_STRIPE_LIVE_WEBHOOK_SECRET","GU71_ZERO_LIVE_PRICE_ID","GU71_ZERO_LIVE_PRODUCT_ID","GU72_QA_ALLOWED_USER_ID","GU72_ZERO_MONTHLY_FULFILLMENT_ENABLED","GU72_ZERO_MONTHLY_QA_ENABLED","GU_BILLING_SITE_ORIGIN","GU_BILLING_TASK_SECRET","GU_F600_LIVE_CATALOG_JSON","GU_F600_LIVE_CHECKOUT_ENABLED","GU_F600_LIVE_FULFILLMENT_APPROVED","GU_F600_LIVE_WEBHOOK_ENABLED","GU_F600_LIVE_WEBHOOK_SECRET","GU_PAYMENT_LIVE_LAUNCH_APPROVED","GU_REPLAY_JOURNAL_V01494_ENABLED","PUBLIC_SITE_URL","REQUIRE_STAFF_AAL2_V135","SUPABASE_PUBLISHABLE_KEY","SUPABASE_SECRET_KEY","SUPABASE_URL","TURNSTILE_SECRET_KEY","TURNSTILE_SITE_KEY"];
          const token=process.env.CF_TOKEN;
          if(!token||token.length<20)throw Error('Missing master credential');
          const get=async(path)=>{
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{
              headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(17000)});
            const j=await r.json().catch(()=>({success:false}));
            if(!j.success)throw Error('Cloudflare GET HTTP '+r.status+' '+path);
            return j.result;
          };
          const [acct,p,crons,sub,widgets,workers]=await Promise.all([
            get('/accounts/'+account),
            get('/accounts/'+account+'/pages/projects/'+project),
            get('/accounts/'+account+'/workers/scripts/ground-up-billing-scheduler/schedules'),
            get('/accounts/'+account+'/workers/scripts/ground-up-billing-scheduler/subdomain'),
            get('/accounts/'+account+'/challenges/widgets'),
            get('/accounts/'+account+'/workers/scripts')
          ]);
          if(acct.id!==account||p.id!=='2cf1b496-5f6a-4cb0-89ba-b1519c08154b')
            throw Error('Master account/project ID mismatch');
          const env=p.deployment_configs?.production?.env_vars||{};
          const present=Object.keys(env).sort();
          const missing=baseline.filter(k=>!env[k]);
          const extra=present.filter(k=>!baseline.includes(k));
          const secrets=['SUPABASE_SECRET_KEY','GU39_STRIPE_TEST_SECRET_KEY',
            'GU39_STRIPE_TEST_WEBHOOK_SECRET','GU58_STRIPE_LIVE_SECRET_KEY',
            'GU58_STRIPE_LIVE_WEBHOOK_SECRET','GU_F600_LIVE_WEBHOOK_SECRET'];
          const missingSecrets=secrets.filter(k=>env[k]?.type!=='secret_text');
          const flags=['GU_PAYMENT_LIVE_LAUNCH_APPROVED','GU58_LIVE_CHECKOUT_ENABLED',
            'GU58_LIVE_WEBHOOK_ENABLED','GU58_LIVE_DB_CONTRACT_APPROVED',
            'GU58_LIVE_FULFILLMENT_APPROVED','GU_F600_LIVE_CHECKOUT_ENABLED',
            'GU_F600_LIVE_WEBHOOK_ENABLED','GU_F600_LIVE_FULFILLMENT_APPROVED',
            'GU72_ZERO_MONTHLY_FULFILLMENT_ENABLED','GU72_ZERO_MONTHLY_QA_ENABLED'];
          const liveSafe=flags.every(k=>env[k]?.value==='false');
          if(!liveSafe)throw Error('LIVE payment safety gate violated');
          if((crons.schedules||[]).length!==0||sub.enabled!==false||sub.previews_enabled!==false)
            throw Error('Worker became active or publicly reachable');
          if(!workers.some(w=>w.id==='ground-up-billing-scheduler'))
            throw Error('Master Worker missing');
          const result={
            account,project,sourceBaselineCount:baseline.length,
            productionVariableCount:present.length,variableNames:present,
            missingBaselineNames:missing,additionalNames:extra,
            missingEncryptedSecretNames:missingSecrets,
            githubSource:p.source?.type,productionBranch:p.production_branch,
            gitProductionDeployments:p.source?.config?.production_deployments_enabled,
            gitPreviewSetting:p.source?.config?.preview_deployment_setting,
            masterWorkerPresent:true,masterWorkerCronCount:0,
            workerPublic:false,
            managedTurnstileHosts:widgets.map(w=>({name:w.name,domains:w.domains})),
            livePaymentFlagsSafelyDisabled:liveSafe,paymentOperations:0
          };
          console.log(JSON.stringify(result,null,2));
          NODE
