name: Founding 600 Source & Security Gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  founder-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frozen Founding contract and staged 14-day checkout lock
        run: |
          node --check functions/_lib/founding600-benefit-guards-v014170.mjs
          node --check assets/js/lab-engine-v33-visual.js
          node --check assets/js/lab-engine-v32-universal.js
          node --test tests/test_founding600_benefit_guards_v014170.mjs
          node --input-type=module -e "
            import fs from 'node:fs';
            import assert from 'node:assert/strict';
            const c=JSON.parse(fs.readFileSync('data/founding600-terms-v014170.json','utf8'));
            assert.equal(c.capacity,600);
            assert.deepEqual(Object.keys(c.plans).sort(),['FOUNDING_14','FOUNDING_30','FOUNDING_60']);
            assert.equal(c.plans.FOUNDING_14.recurringCents,2299);
            assert.equal(c.plans.FOUNDING_14.billingIntervalDays,14);
            assert.equal(c.plans.FOUNDING_14.foundingDiscountBps,500);
            assert.equal(c.plans.FOUNDING_14.incSparks,10);
            assert.equal(c.plans.FOUNDING_14.includedSparksNeverExpire,true);
            assert.equal(c.disclosures.includedSparksExpireAfterPeriod,false);
            assert.equal(c.plans.FOUNDING_14.checkoutEnabled,false,'The 14-day plan must not be made sellable by a source-only change');
            assert.equal(c.checkoutEnabled,false,'No paid checkout before certified production acceptance');
            assert.equal(c.plans.FOUNDING_30.recurringCents,4999);
            assert.equal(c.plans.FOUNDING_30.billingIntervalDays,30);
            assert.equal(c.plans.FOUNDING_30.foundingDiscountBps,1000);
            assert.equal(c.plans.FOUNDING_30.incSparks,15);
            assert.equal(c.plans.FOUNDING_30.incSparksExpiryDaysAfterTermEnd,null);
            assert.equal(c.plans.FOUNDING_30.includedSparksNeverExpire,true);
            assert.equal(c.plans.FOUNDING_60.recurringCents,5999);
            assert.equal(c.plans.FOUNDING_60.billingIntervalDays,60);
            assert.equal(c.plans.FOUNDING_60.foundingDiscountBps,1500);
            assert.equal(c.plans.FOUNDING_60.incSparks,20);
            assert.equal(c.plans.FOUNDING_60.incSparksExpiryDaysAfterTermEnd,null);
            assert.equal(c.plans.FOUNDING_60.includedSparksNeverExpire,true);
            assert.deepEqual(c.discount.exclude,['FOUNDING_14','FOUNDING_30','FOUNDING_60']);
            assert(c.discount.eligible.includes('LIFETIME'));
            assert.equal(c.purchasedSparksExpire,false);
            assert.equal(c.tradingExecutionIncluded,false);
            console.log('PASS Founding terms: 14-day starter staged only, 30/60 pricing and discounts unchanged; no checkout activation in this workflow');
          "

      - name: Enforce 10/15 percent founder commercial contract
        run: |
          node --test tests/test_founder_discount_15_contract.mjs
          node --test tests/test_book_receipt_contact_v1.mjs
          node tests/test_book_receipt_support_contract_v1.mjs
          node tests/test_support_routing_v1.mjs

      - name: Check member-ready Commons, Design Studio, Blueprint and billing gates
        run: |
          node --check assets/js/founders-commons-v014178.js
          node tests/test_f600_shared_beta_qa_sql.mjs
          node --check assets/js/founders-design-studio-v014184.js
          node --check assets/js/founders-learning-blueprint-v014185.js
          node --check assets/js/admin-founder-commons-v014181.js
          node --check functions/api/admin-founder-commons-v014179.js
          test -f founders-commons.html
          test -f admin-founders.html
          grep -q 'founders-design-studio-v014184.js' founders-commons.html
          grep -q 'founders-learning-blueprint-v014185.js' founders-commons.html
          grep -q 'CREATE POLICY founder_own_design_read_v014184' supabase/migrations/v0.14.0.184_founder_personal_design_preferences.sql
          grep -q 'FOUNDER_ACCESS_REQUIRED' supabase/migrations/v0.14.0.185_founder_learning_blueprint.sql

      - name: Validate founder legacy, both-tier voting and priority communication source
        run: |
          node --check assets/js/founder-legacy-v014187.js
          node --check assets/js/founders-improvement-polls-v014188.js
          node --check assets/js/admin-founder-improvement-v014188.js
          node --check assets/js/founders-announcements-v014189.js
          test -f founder-legacy.html
          grep -q 'founder-legacy-v014187.js' founder-legacy.html
          grep -q 'founders-improvement-polls-v014188.js' founders-commons.html
          grep -q 'founders-announcements-v014189.js' founders-commons.html
          grep -q 'FOUNDER_ACCESS_REQUIRED' supabase/migrations/v0.14.0.188_founder_shared_improvement_polls.sql
          grep -q 'Withdrawal is ALWAYS permitted' supabase/migrations/v0.14.0.186_founder_legacy_optin.sql

      - name: Verify Founders Learning Studio and editorial security gates
        run: |
          node --check assets/js/founder-learning-studio-v014191.js
          node --check assets/js/admin-founder-learning-v014191.js
          node --check functions/api/admin-founder-commons-v014179.js
          test -f founder-learning-studio.html
          grep -q 'founder-learning-studio-v014191.js' founder-learning-studio.html
          grep -q 'founder-learning-studio.html' founders-commons.html
          grep -q 'gu_founder_submit_case_v014190' supabase/migrations/v0.14.0.190_founder_educational_resources_and_case_review.sql
          grep -q 'rights_cleared' supabase/migrations/v0.14.0.190_founder_educational_resources_and_case_review.sql
          node --test tests/test_founder_admin_security_v014181.mjs

      - name: Test Stripe LIVE founding checkout and paid-cycle fail-closed gates
        run: |
          node --check functions/api/founding600-checkout.js
          node --check functions/api/founding600-webhook.js
          node --check assets/js/founding600-enrollment-v014198.js
          node --check assets/js/founder-learning-studio-v014191.js
          node --check assets/js/admin-founder-learning-v014191.js
          node --test tests/test_founder_payment_gates_v014199.mjs
          node tests/test_founding14_staged_checkout_v1.mjs
          node --test tests/test_founder_full_price_checkout_guard_v014268.mjs
          node --test tests/test_beta_public_free_open_v014269.mjs
          node --test tests/test_founder_live_product_preflight_v014265.mjs
          node --test tests/test_founder_catalog_provider_v014264.mjs
          test -f founding600.html
          grep -q 'founding600-enrollment-v014198.js' founding600.html
          grep -q 'GU_F600_LIVE_CHECKOUT_ENABLED' functions/api/founding600-checkout.js
          grep -q "'/api/founding600-checkout'" functions/_middleware.js
          grep -q 'GU_F600_LIVE_WEBHOOK_ENABLED' functions/api/founding600-webhook.js
          grep -q 'fulfillment_enabled boolean NOT NULL DEFAULT false' supabase/migrations/v0.14.0.196_founder_paid_cycle_atomic_entitlements.sql
          grep -q 'F600-2026-10-24' supabase/migrations/v0.14.0.198_founder_recurring_consent_record.sql

      - name: Validate founder payment chronology, first-party entitlement catalog, and seat invariants
        run: |
          test -f supabase/migrations/v0.14.0.195_founder_entitlement_catalog_noncharging.sql
          test -f supabase/migrations/v0.14.0.196_founder_paid_cycle_atomic_entitlements.sql
          test -f supabase/migrations/v0.14.0.198_founder_recurring_consent_record.sql
          test -f supabase/migrations/v0.14.0.201_exact_founding_paid_cycle_invariants.sql
          test -f supabase/migrations/v0.14.0.202_founder_invoice_consent_and_freshness_guard.sql
          grep -q 'FOUNDER_RECURRING_CONSENT_OR_BINDING_MISSING' supabase/migrations/v0.14.0.202_founder_invoice_consent_and_freshness_guard.sql
          grep -q 'FOUNDER_STALE_BILLING_PERIOD' supabase/migrations/v0.14.0.202_founder_invoice_consent_and_freshness_guard.sql
          grep -q 'p.checkout_enabled=true' supabase/migrations/v0.14.0.195_founder_entitlement_catalog_noncharging.sql
          grep -q "expires_at:String" functions/api/founding600-checkout.js

      - name: Verify Founder nonpayment benefits and privacy contract
        run: |
          node --test tests/test_founder_nonpayment_benefits_v014211.mjs
          node --check assets/js/admin-founder-benefits-v014205.js
          node --check assets/js/admin-founder-notices-v014206.js
          node --check assets/js/founder-benefit-records-v014205.js
          node --check assets/js/founders-announcements-v014189.js
          test -f founder-benefits.html
          grep -q 'founder-benefits.html' founders-commons.html
          grep -q 'gu_founder_issue_certificate_v014192' functions/api/admin-founder-commons-v014179.js
          grep -q 'gu_founder_record_service_incident_v014203' functions/api/admin-founder-commons-v014179.js
          grep -q 'gu_founder_targeted_notices_v014206' functions/api/admin-founder-commons-v014179.js

      - name: Prevent regression of Founder case-study withdrawal redaction
        run: |
          node --check assets/js/founder-learning-studio-v014191.js
          grep -q 'contentRedacted' supabase/migrations/v0.14.0.212_founder_case_withdrawal_content_redaction.sql
          grep -q 'ONE_PER_60_DAYS' supabase/migrations/v0.14.0.190_founder_educational_resources_and_case_review.sql
          grep -q 'extended' assets/js/founder-learning-studio-v014191.js

      - name: Verify Extended Founder's sixty-day route source and entitlement boundary
        run: |
          node --check assets/js/founder-extended-path-v014213.js
          test -f founder-extended-path.html
          grep -q 'founder-extended-path.html' founder-learning-studio.html
          grep -q 'CURRICULUM_VERSION_MISMATCH' supabase/migrations/v0.14.0.213_extended_founder_60_day_guided_path.sql
          grep -q "count_defs<>30" supabase/migrations/v0.14.0.213_extended_founder_60_day_guided_path.sql
          grep -q 'EXTENDED_FOUNDER_REQUIRED' supabase/migrations/v0.14.0.213_extended_founder_60_day_guided_path.sql

      - name: Verify paid-cycle PostgreSQL trigger regression fix
        run: |
          test -f supabase/migrations/v0.14.0.214_founder_paid_cycle_trigger_alias_fix.sql
          grep -q 'earlier_cycle.stripe_subscription_id' supabase/migrations/v0.14.0.214_founder_paid_cycle_trigger_alias_fix.sql
          if grep -q 'old.stripe_subscription_id' supabase/migrations/v0.14.0.214_founder_paid_cycle_trigger_alias_fix.sql; then exit 1; fi

      - name: Run signed Founding 600 Sandbox webhook acceptance
        run: |
          node --check functions/_lib/founder-sandbox-lifecycle-v014216.js
          node --check functions/api/gu39-stripe-webhook.js
          node --test tests/test_f600_signed_sandbox_webhook_v014217.mjs
          test -f supabase/migrations/v0.14.0.215_founder_sandbox_shadow_lifecycle.sql
          grep -q 'gu_f600_sandbox_apply_v014215' functions/_lib/founder-sandbox-lifecycle-v014216.js
          grep -q 'handleFounderSandbox' functions/api/gu39-stripe-webhook.js

      - name: Accept founder signed payment and reversal lifecycle without LIVE charges
        run: |
          node --check functions/api/founding600-webhook.js
          node --test tests/test_f600_live_signed_lifecycle_v014219.mjs
          node --test tests/test_f600_signed_sandbox_webhook_v014217.mjs
          test -f supabase/migrations/v0.14.0.218_founder_verified_subscription_status.sql
          grep -q 'GU_F600_LIVE_WEBHOOK_ENABLED' functions/api/founding600-webhook.js

      - name: Require refund reversal RPC, provider state and isolated signed Sandbox ledger
        run: |
          test -f supabase/migrations/v0.14.0.200_founder_refund_dispute_and_status_ledger.sql
          test -f supabase/migrations/v0.14.0.215_founder_sandbox_shadow_lifecycle.sql
          test -f supabase/migrations/v0.14.0.218_founder_verified_subscription_status.sql
          grep -q 'CREATE OR REPLACE FUNCTION public.gu_founder_reverse_paid_invoice_v014200' supabase/migrations/v0.14.0.200_founder_refund_dispute_and_status_ledger.sql
          grep -q 'TO service_role' supabase/migrations/v0.14.0.200_founder_refund_dispute_and_status_ledger.sql
          grep -q 'gu_founder_reverse_paid_invoice_v014200' functions/api/founding600-webhook.js
          node --test tests/test_f600_live_signed_lifecycle_v014219.mjs
          node --test tests/test_f600_signed_sandbox_webhook_v014217.mjs
