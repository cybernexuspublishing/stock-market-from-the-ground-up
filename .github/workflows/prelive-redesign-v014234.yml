name: Pre-LIVE Website Redesign Acceptance v0.14.0.234
on:
  push:
    branches: [main]
    paths:
      - 'assets/css/store-release-finish-v014234.css'
      - 'tests/test_v014179_store_visibility_contract.mjs'
      - 'functions/api/store-product-overrides.js'
      - 'assets/js/store-inventory-ui-v014174.js'
      - 'assets/js/store-inventory-v014174.js'
      - 'assets/js/admin-product-catalog-v014175.js'
      - 'assets/css/premium-design-v014168.css'
      - 'index.html'
      - 'store.html'
      - 'store-all-products.html'
      - 'store-upcoming-product.html'
      - 'dashboard.html'
      - 'admin.html'
      - 'tests/test_v014234_prelive_redesign_playwright.mjs'
      - '.github/workflows/prelive-redesign-v014234.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  noncharging-redesign-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static source and syntax boundaries
        run: |
          node --check assets/js/store-inventory-ui-v014174.js
          node --check assets/js/admin-product-catalog-v014175.js
          node --check tests/test_v014234_prelive_redesign_playwright.mjs
          node tests/test_v014174_unified_storefront_inventory.mjs
          node tests/test_v014175_owner_product_overlays.mjs
          node tests/test_v014179_store_visibility_contract.mjs
          node tests/test_v014180_owner_store_acceptance.mjs
          node tests/test_v014181_store_display_contract.mjs
      - name: Install pinned browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start offline local site fixture
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/redesign-acceptance-v014234.log 2>&1 &
          sleep 2
      - name: Chromium responsive Store and mock Owner acceptance — no payments
        env:
          GU_REDESIGN_BASE: http://127.0.0.1:8765
        run: node tests/test_v014234_prelive_redesign_playwright.mjs
