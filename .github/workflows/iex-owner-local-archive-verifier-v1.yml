name: IEX Owner Local Archive Verifier V1
on:
  push:
    branches: [main]
    paths:
      - 'scripts/market-data/verify_local_iex_archive_v1.py'
      - 'scripts/market-data/iex_tops.py'
      - 'tests/test_iex_local_archive_integrity_v1.py'
      - '.github/workflows/iex-owner-local-archive-verifier-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-fixture-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate filename and offline original-archive integrity verifier
        run: |
          python -m py_compile scripts/market-data/iex_tops.py scripts/market-data/verify_local_iex_archive_v1.py
          python -m unittest discover -s tests -p 'test_iex_local_archive_integrity_v1.py' -v
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts/market-data')
          from iex_tops import NAME
          assert NAME.fullmatch('data_feeds_20260921_20260921_IEXTP1_TOPS1.6.pcap.gz')
          assert NAME.fullmatch('20260921_IEXTP1_TOPS1.6.pcap.gz')
          assert not NAME.fullmatch('data_feeds_20260921_20260921_IEXTP1_TOPS1.7.pcap.gz')
          print('PASS accepted official filename, rejected incorrect feed version')
          PY
