name: Backend Contract v0.14.0.31
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel obsolete push checks, preserve isolated manual/explicit reruns.
concurrency:
  group: backend-source-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
jobs:
  stripe-and-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source security and version checks
        run: |
          python tests/test_v014031_source.py
          python tests/test_v014030_ebook_release.py
      - name: Stripe checkout webhook refund regression
        run: |
          node tests/test_v014031_stripe.mjs
          node tests/test_v014028_commerce_api.mjs
          node tests/test_v014031_owner_detail.mjs
      - name: Install isolated Chromium browser runner
        run: |
          # Match the browser build already accepted by the central sitewide Chromium job.
          # Python 1.57.0 requests unavailable browser build v1200 on current runner.
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: 'Member storefront: signed paperback/hardcover and terms acceptance'
        run: python tests/test_v014031_browser.py
      - name: Ensure private source boundary
        run: |
          bash scripts/build-pages.sh
          test ! -e public/functions
          test ! -e public/supabase
          test ! -e public/tests
          test ! -e public/data/interactive-labs.json
