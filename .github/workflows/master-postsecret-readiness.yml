name: Yahoo Master — Six Encrypted Bindings and Nonpayment Readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/master-postsecret-readiness.yml'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read secret presence, never secret values
        env:
          CF_TOKEN: ${{ secrets.SMFGU_LIVES_PAGES_DEPLOY }}
        run: |
          node --input-type=module <<'NODE'
          const account='4fe9e562905cf607b6f004d2374299fc',project='stock-market-from-the-ground-up';
          const token=process.env.CF_TOKEN;if(!token||token.length<20)throw Error('Missing Cloudflare credential');
          const req=async path=>{
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{
              authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>({success:false}));
            if(!j.success)throw Error('Cloudflare GET HTTP '+r.status);
            return j.result;
          };
          const [accountDetail,p,crons,sub]=await Promise.all([
            req('/accounts/'+account),
            req('/accounts/'+account+'/pages/projects/'+project),
            req('/accounts/'+account+'/workers/scripts/ground-up-billing-scheduler/schedules'),
            req('/accounts/'+account+'/workers/scripts/ground-up-billing-scheduler/subdomain')
          ]);
          if(accountDetail.id!==account||p.id!=='2cf1b496-5f6a-4cb0-89ba-b1519c08154b')
            throw Error('Account/Pages identity mismatch');
          const env=p.deployment_configs?.production?.env_vars||{};
          const required=['SUPABASE_SECRET_KEY','GU39_STRIPE_TEST_SECRET_KEY',
            'GU39_STRIPE_TEST_WEBHOOK_SECRET','GU58_STRIPE_LIVE_SECRET_KEY',
            'GU58_STRIPE_LIVE_WEBHOOK_SECRET','GU_F600_LIVE_WEBHOOK_SECRET'];
          const missing=required.filter(k=>env[k]?.type!=='secret_text');
          const nonpaymentMissing=missing.filter(k=>['SUPABASE_SECRET_KEY','GU39_STRIPE_TEST_SECRET_KEY','GU39_STRIPE_TEST_WEBHOOK_SECRET'].includes(k));
          const flags=['GU_PAYMENT_LIVE_LAUNCH_APPROVED','GU58_LIVE_CHECKOUT_ENABLED',
            'GU58_LIVE_WEBHOOK_ENABLED','GU58_LIVE_DB_CONTRACT_APPROVED',
            'GU58_LIVE_FULFILLMENT_APPROVED','GU_F600_LIVE_CHECKOUT_ENABLED',
            'GU_F600_LIVE_WEBHOOK_ENABLED','GU_F600_LIVE_FULFILLMENT_APPROVED',
            'GU72_ZERO_MONTHLY_QA_ENABLED','GU72_ZERO_MONTHLY_FULFILLMENT_ENABLED'];
          if(flags.some(k=>env[k]?.value!=='false'))throw Error('Unsafe payment or QA gate');
          if((crons.schedules||[]).length!==0||sub.enabled!==false||sub.previews_enabled!==false)
            throw Error('Worker accidentally active/public');
          console.log(JSON.stringify({masterAccount:account,pagesProject:project,
            sixExpectedEncryptedBindings:required.length,missingEncryptedBindings:missing,
            sixBindingsPresent:missing.length===0,
            nonpaymentSecretsReady:nonpaymentMissing.length===0,
            pendingLiveOnlyCredentialNames:missing.filter(k=>!nonpaymentMissing.includes(k)),
            livePaymentFlagsDisabled:true,
            billingWorkerScheduled:false,livePaymentsPerformed:0},null,2));
          if(missing.length)throw Error('BLOCKED: one or more of six encrypted provider bindings missing');
          NODE
      - name: Verify public advertising backend database integration (GET only)
        run: |
          node --input-type=module <<'NODE'
          const url='https://stock-market-from-the-ground-up-d1r.pages.dev/api/ad-sales';
          const response=await fetch(url,{method:'GET',redirect:'manual',
            headers:{Accept:'application/json'},signal:AbortSignal.timeout(15000)});
          if(response.status!==200)throw Error('Public ad backend not ready: HTTP '+response.status);
          const body=await response.json();
          if(body.ok!==true||body.onlineCheckoutEnabled!==false||!Array.isArray(body.packages)||body.packages.length!==3)
            throw Error('Unexpected advertising backend contract');
          if(body.turnstileSiteKey!=='0x4AAAAAAFlx7GxnPwFqJCMc')
            throw Error('Master Turnstile is not being used by the advertising backend');
          console.log(JSON.stringify({adBackend:true,advertisingPackages:body.packages.length,
            onlineCheckoutEnabled:false,paymentOperations:0}));
          NODE
      - name: Verify unauthenticated Sandbox and Admin access is denied
        run: |
          node --input-type=module <<'NODE'
          const origin='https://stock-market-from-the-ground-up-d1r.pages.dev';
          const denied=['/api/gu39-sandbox','/api/admin-prelive-v014247','/api/owner-zero-live-checkout'];
          for(const path of denied){
            const r=await fetch(origin+path,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(15000)});
            if(r.status!==401)throw Error('Guest authorization mismatch '+path+' HTTP '+r.status);
          }
          console.log(JSON.stringify({guestAccessDeniedRoutes:denied.length,paymentOperations:0}));
          NODE
