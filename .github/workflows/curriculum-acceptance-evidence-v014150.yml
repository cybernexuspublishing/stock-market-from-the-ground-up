name: Canonical Curriculum Individual Acceptance Ledger D11-D14/D18
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  curriculum-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical curriculum decisions without awarding completion
        run: |
          node tests/test_671_mandatory_primary_source_research_v1.mjs
          node tests/test_v014150_curriculum_acceptance.mjs
          node tests/test_v014151_foundations_content_gate.mjs
          node tests/test_v014151_lab_visual_layout.mjs
          node tests/test_v014151_foundations_rubric_queue.mjs
          node tests/test_v014151_self_reported_lab_progress.mjs
          node tests/test_v014152_other325_evidence.mjs
          node tests/test_v014152_other325_editor_queue.mjs
          node tests/test_v014153_paged_member_grade_history.mjs
          node tests/test_v014153_training_stale_mode.mjs
          node tests/test_v014154_bootcamp_formative.mjs
          node tests/test_v014154_bootcamp_day05_visual.mjs
          node --check assets/js/bootcamp-day05-v014154.js
          node --check assets/js/bootcamp.js
          node --check functions/api/interactive-training.js
          node --check assets/js/training-editor.js
          node --check assets/js/labs.js
          node --check assets/js/lab-player.js
          node --check assets/js/interactive-training.js
          node --check assets/js/training-editor.js
      - uses: actions/upload-artifact@v4
        with:
          name: groundup-curriculum-419-labs-30-bootcamp-acceptance
          path: |
            artifacts/curriculum-acceptance-v014150.json
            artifacts/curriculum-acceptance-v014150.csv
            artifacts/d11-foundations-94-content-gaps.json
            artifacts/d11-foundations-94-content-gaps.csv
            artifacts/d12-other325-acceptance.json
            artifacts/d12-other325-acceptance.csv
          if-no-files-found: error
          retention-days: 30
