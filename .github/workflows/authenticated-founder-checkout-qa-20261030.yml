name: SMFGU Actual Authenticated Founder Checkout QA (No Charge)
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_authenticated_founder_checkout_production_20261030.mjs'
      - '.github/workflows/authenticated-founder-checkout-qa-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  authenticated-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and browser
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check real member authentication, release gates and LIVE Stripe checkout session only
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_authenticated_founder_checkout_production_20261030.mjs
