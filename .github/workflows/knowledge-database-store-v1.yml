name: Knowledge Database and Store Presentation Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/knowledge-database-store-v1.yml'
      - 'knowledge-database.html'
      - 'chart-reveal-practice.html'
      - 'assets/js/knowledge-database-expanded-v2.js'
      - 'assets/js/knowledge-database-workshop-v1.js'
      - 'assets/css/knowledge-database-expanded-v2.css'
      - 'tests/test_knowledge_database_expansion_v2.mjs'
      - 'tests/test_knowledge_database_browser_v2.mjs'
      - 'docs/releases/2026-10-30_KNOWLEDGE_DATABASE_EXPANSION_v2.md'
      - 'bootcamp-academy.html'
      - 'assets/css/bootcamp-academy-icons-v1.css'
      - 'assets/css/bootcamp-academy-gallery-v2.css'
      - 'assets/images/bootcamp-covers/**'
      - 'tests/test_academy_catalog_icons_v1.mjs'
      - 'assets/js/bootcamp-academy-v014168.js'
      - 'assets/js/free-foundations-knowledge-v1.js'
      - 'assets/css/bootcamp-academy-compact-v2.css'
      - 'assets/js/navigation.js'
      - 'store.html'
      - 'assets/js/store.js'
      - 'tests/test_knowledge_database_store_v1.mjs'
jobs:
  content-and-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Free knowledge, Store display and Academy scope
        run: |
          node tests/test_free_foundations_knowledge_v1.mjs
          node tests/test_knowledge_database_expansion_v2.mjs
          node --check assets/js/knowledge-database-expanded-v2.js
          node --check assets/js/knowledge-database-workshop-v1.js
          node tests/test_knowledge_database_store_v1.mjs
          node tests/test_academy_catalog_icons_v1.mjs
          node --check assets/js/navigation.js
          node --check assets/js/store.js
          node --check assets/js/bootcamp-academy-v014168.js

  browser-study-acceptance:
    needs: content-and-scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned no-charge Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify independent knowledge search and fictional study workflow
        run: node tests/test_knowledge_database_browser_v2.mjs
