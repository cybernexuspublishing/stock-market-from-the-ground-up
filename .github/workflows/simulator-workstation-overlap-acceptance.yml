name: Crownlight Simulator Workstation Overlap Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/css/crownlight-simulator-density-v1.css'
      - 'assets/js/simulator.js'
      - 'simulator.html'
      - 'tests/test_free_simulator_starter_v1.mjs'
      - 'tests/test_simulator_workstation_overlap_v1_browser.mjs'
      - '.github/workflows/simulator-workstation-overlap-acceptance.yml'
permissions:
  contents: read
jobs:
  script-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulator source syntax and existing source boundary regressions
        run: |
          node --check assets/js/simulator.js
          node --check assets/js/crownlight-simulator-layout-v3.js
          node --check tests/test_simulator_workstation_overlap_v1_browser.mjs
          node tests/test_v014112_server_first_simulator.mjs
          node tests/test_sellable_simulator_csv_integrity_v1.mjs
          node tests/test_free_simulator_starter_v1.mjs
          node tests/test_v014145_marketdata_byo_security.mjs
      - name: Confirm source assets in built Pages
        run: |
          bash scripts/build-pages.sh
          test -f public/assets/js/simulator.js
          test -f public/assets/css/crownlight-simulator-density-v1.css
          test -f public/simulator.html
          test ! -d public/functions
  chromiums-responsive-workstation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install no-cost pinned Chromium dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify screenshot reproduction, overlap removal and source validation
        run: node tests/test_simulator_workstation_overlap_v1_browser.mjs
      - name: Existing compact, comfortable and mobile geometry regression
        run: node tests/test_crownlight_simulator_density_browser_v1.mjs
