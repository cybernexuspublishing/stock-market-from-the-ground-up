name: 30-Day Bootcamp & Member Reflection Acceptance v0.14.0.144
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootcamp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test actual bootcamp API, all 30 days, 419 Lab mapping and unsafe account transitions
        run: |
          node tests/test_v014144_bootcamp.mjs
          node tests/test_v014168_academy_family.mjs
          node tests/test_lab_batch01_authenticated_access.mjs
          node tests/test_gate1_founders_beta_handoff.mjs
          node tests/test_labs_account_switch_isolation.mjs
          node tests/test_lab_content_redaction.mjs
          node tests/test_site_exclusive_guided_beta_v014294.mjs
          node tests/test_gate1_lab_registry_publish_gate.mjs
          node tests/test_lab_beta_publication_gate.mjs
          node tests/test_beta_partial_release_registry.mjs
          node tests/test_active_lab_beta_resilience.mjs
          node --check assets/js/labs.js
          node tests/test_continuous_beta_releases.mjs
          node tests/test_sellable_training_product_v1.mjs
          node tests/test_interactive_learning_purchase_access_v1.mjs
          node tests/test_truth5_archive8_source_cases.mjs
          node --check assets/js/bootcamp-academy-v014168.js
          node --check assets/js/store-training-programs-v1.js
          node --check assets/js/store-inventory-ui-v014174.js
          node tests/test_founding_members_public_names.mjs
          node --check assets/js/dashboard.js
          node --check assets/js/lab-registry.js
          node tests/test_f600_guided_qa_access.mjs
          node tests/test_member_beta_support_surface.mjs
          node tests/test_support_partial_create_resilience.mjs
          node --check functions/api/support.js
          node --check assets/js/member-support-panel.js
          node --check functions/api/lab-release-availability.js
          node --check assets/js/labs.js
          node --check functions/_lib/bootcamp-academy-v014168.js
          node --check assets/js/bootcamp-academy-v014168.js
          node --check functions/api/bootcamp.js
          node --check assets/js/bootcamp.js
          node --check functions/api/ondemand-training.js
          node tests/test_v014143_verified_historical_gate.mjs
          bash scripts/build-pages.sh
          test -f public/bootcamp.html
          test -f public/assets/js/bootcamp.js
          test -f public/assets/css/bootcamp.css
          test ! -e public/functions/_lib/bootcamp-curriculum-v014144.js
          test ! -e public/supabase/migrations/v0.14.0.144_BOOTCAMP_PROGRESS_OWNER_REVIEW_REQUIRED.sql
  bootcamp-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: groundup
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d groundup"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply actual migration and verify member-specific atomic SQL contracts
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d groundup -f tests/fixtures/v014144_bootcamp_acceptance.sql
      - name: Verify $19.99 training subscription authorizes Academy only
        env:
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres groundup_training
          psql -h localhost -U postgres -d groundup_training -v ON_ERROR_STOP=1 -f tests/fixtures/20261026_training_membership_delivery.sql
