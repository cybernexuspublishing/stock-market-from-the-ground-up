name: Backend Contract v0.14.0.29
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-print-and-release-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser required by earlier release regression tests
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Signed author-copy fulfillment safety and CI version compatibility
        run: |
          python tests/test_v014029_signed_print_and_release.py
          python tests/test_v014028_commerce_source.py
          python tests/test_v014027_release.py
          python tests/test_v014026_release.py
      - name: Existing commerce and moderation API regression
        run: |
          node tests/test_v014028_commerce_api.mjs
          node tests/test_v014025_history_api.mjs
      - name: Prepare isolated Chromium runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Signed-book storefront flag combinations in isolated browser
        run: |
          python tests/test_v014029_print_browser.py
      - name: Build privacy boundary
        run: |
          bash scripts/build-pages.sh
          test ! -e public/functions
          test ! -e public/supabase
          test ! -e public/tests
          test ! -e public/data/interactive-labs.json
