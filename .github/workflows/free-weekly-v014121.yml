name: Free Weekly Limits and Full Monthly Parity v0.14.0.121
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/v0.14.0.121_FREE_WEEKLY_QUOTA_OWNER_REVIEW_REQUIRED.sql'
      - 'tests/test_v014121_free_quota_parity.mjs'
      - 'tests/fixtures/v014121_*'
      - 'assets/js/store.js'
      - 'assets/js/membership-platform.js'
      - 'assets/js/commerce-common.js'
      - 'assets/js/store-product-detail-v01484.js'
      - 'assets/js/journal.js'
      - '.github/workflows/free-weekly-v014121.yml'
  pull_request:
    paths:
      - 'supabase/migrations/v0.14.0.121_FREE_WEEKLY_QUOTA_OWNER_REVIEW_REQUIRED.sql'
      - 'tests/test_v014121_free_quota_parity.mjs'
      - 'tests/fixtures/v014121_*'
      - 'assets/js/store.js'
      - 'assets/js/membership-platform.js'
      - 'assets/js/commerce-common.js'
      - 'assets/js/store-product-detail-v01484.js'
      - 'assets/js/journal.js'
      - '.github/workflows/free-weekly-v014121.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          node --check assets/js/store.js
          node --check assets/js/membership-platform.js
          node --check assets/js/store-product-detail-v01484.js
          node --check assets/js/journal.js
          node --check assets/js/simulator.js
          node tests/test_v014121_free_quota_parity.mjs
          bash scripts/build-pages.sh
          test ! -e public/supabase
  real-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: disposable_only,POSTGRES_DB: free_week_v121}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d free_week_v121"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: disposable_only
      PGDATABASE: free_week_v121
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! command -v psql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; fi
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/v014118_replay_lifecycle_schema.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/v014121_free_weekly_schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/v0.14.0.121_FREE_WEEKLY_QUOTA_OWNER_REVIEW_REQUIRED.sql
          psql -v ON_ERROR_STOP=1 -f tests/fixtures/v014121_free_weekly_acceptance.sql
