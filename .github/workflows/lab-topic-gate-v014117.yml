name: 419 Lab Topic Rubric Gate v0.14.0.117
on:
  pull_request:
    paths: ['functions/api/training-editor.js','assets/js/training-editor.js','training-editor.html','docs/419_LAB_TOPIC_ALIGNMENT_REVIEW_v014117.csv','tests/test_v014117_lab_topic_gate.mjs','.github/workflows/lab-topic-gate-v014117.yml']
  push:
    branches: [main]
    paths: ['functions/api/training-editor.js','assets/js/training-editor.js','training-editor.html','docs/419_LAB_TOPIC_ALIGNMENT_REVIEW_v014117.csv','tests/test_v014117_lab_topic_gate.mjs','.github/workflows/lab-topic-gate-v014117.yml']
permissions:
  contents: read
jobs:
  lab-rubric:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check functions/api/training-editor.js
          node --check assets/js/training-editor.js
          node tests/test_v014117_lab_topic_gate.mjs
          node tests/test_v014105_reviewed_knowledge_bridge.mjs
          node tests/test_v014096_419_conceptual_training.mjs
