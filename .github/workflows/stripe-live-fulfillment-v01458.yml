name: Locked LIVE Membership Fulfillment v0.14.0.59
on:
  push:
    paths:
      - 'functions/api/stripe-live-*'
      - 'functions/api/checkout.js'
      - 'functions/_middleware.js'
      - 'supabase/migrations/v0.14.0.58*'
      - 'tests/test_v014058_*'
      - 'tests/test_v014059_*'
      - 'tests/test_v014064_*'
      - 'tests/test_v014067_*'
      - 'tests/test_v014068_*'
      - 'tests/test_v014069_*'
      - 'tests/test_v014070_*'
      - 'tests/test_v014071_*'
      - 'tests/test_v014072_*'
      - 'tests/test_v014073_*'
      - 'tests/test_v014076_*'
      - 'tests/test_v014077_*'
      - 'tests/test_v014078_*'
      - 'tests/test_v014081_*'
      - 'tests/test_v014082_*'
      - 'tests/test_v014083_*'
      - 'tests/test_v014084_*'
      - 'tests/test_v014155_*'
      - 'tests/test_v014300_*'
      - 'assets/js/store.js'
      - 'assets/js/store-product-detail-v01484.js'
      - 'store.html'
      - 'store-*.html'
      - 'assets/css/store-catalog-v01484.css'
      - 'data/store-product-guides-v01484.json'
      - 'supabase/migrations/v0.14.0.83_*'
      - 'assets/js/admin-live-activation-v01483.js'
      - 'admin.html'
      - 'supabase/admin/v0.14.0.82_*'
      - 'supabase/admin/v0.14.0.81_*'
      - 'data/store-products.json'
      - 'data/stripe-product-registry-v01437.json'
      - 'scripts/deployment15_catalog_audit.mjs'
      - 'config.js'
      - 'data/commerce-config.json'
      - 'release-manifest.json'
      - 'sw.js'
      - 'assets/js/route-policy.js'
      - 'owner-roadmap.html'
      - 'supabase/migrations/v0.14.0.78*'
      - 'assets/js/account-management-entitlements-v01478.js'
      - 'admin.html'
      - 'functions/api/admin-accounts-v01353.js'
      - 'assets/js/admin-operations.js'
      - 'supabase/migrations/v0.14.0.72*'
      - 'supabase/migrations/v0.14.0.76*'
      - 'assets/js/store-zero-live-qa.js'
      - 'functions/api/store-zero-monthly-qa.js'
      - 'assets/js/checkout-platform.js'
      - 'supabase/admin/v0.14.0.59*'
      - 'supabase/admin/v0.14.0.70*'
      - '.github/workflows/stripe-live-fulfillment-v01458.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify JS syntax, SQL security guards and no automated DB migration
        run: |
          node --check functions/api/stripe-live-checkout-v01458.js
          node --check functions/api/stripe-live-merchant-readiness-v01467.js
          node --check functions/api/stripe-live-webhook-v01458.js
          node --check functions/api/stripe-live-webhook.js
          node --check functions/api/owner-zero-live-checkout.js
          node --check functions/api/store-zero-monthly-qa.js
          node --check assets/js/store-zero-live-qa.js
          node --check assets/js/account-management-entitlements-v01478.js
          node --check functions/api/admin-accounts-v01353.js
          python tests/test_v014072_zero_store_contract.py
          python tests/test_v014076_zero_repeatable_contract.py
          python tests/test_v014081_paid_launch_and_book_prep_contract.py
          python tests/test_v014082_owner_live_payment_activation_contract.py
          python tests/test_v014083_authenticated_owner_live_activation.py
          python tests/test_v014084_store_pages_and_categories.py
          node tests/test_v014084_store_interaction.mjs
          node --check assets/js/store.js
          node --check assets/js/store-product-detail-v01484.js
          node --check assets/js/admin-live-activation-v01483.js
          node --check functions/api/checkout.js
          node --check functions/_middleware.js
          python tests/test_v014058_live_contract.py
          python tests/test_v014059_catalog_contract.py
          python tests/test_v014070_fulfillment_contract.py
      - name: Mock signed LIVE payment and subscription lifecycle — no real Stripe calls
        run: |
          node tests/test_v014058_live_fulfillment.mjs
          node tests/test_v014140_live_checkout_recovery.mjs
          node tests/test_v014155_live_checkout_body_limits.mjs
          node tests/test_v014155_webhook_body_limits.mjs
          node tests/test_v014300_founder_expired_webhook.mjs
          node tests/test_v014155_release_metadata.mjs
      - name: Verify production checkout wiring cannot bypass TEST/LIVE, webhook or product gates
        run: |
          node tests/test_v014064_checkout_wiring.mjs
          node tests/test_v014067_live_merchant_readiness.mjs
          node tests/test_v014069_live_catalog_recovery.mjs
          node tests/test_v014068_stable_webhook.mjs
          node tests/test_v014071_zero_live_checkout.mjs
          node tests/test_v014071_zero_live_webhook.mjs
          node tests/test_v014072_zero_store_checkout.mjs
          node tests/test_v014072_zero_store_signed_webhook.mjs
          node tests/test_v014073_zero_store_setup_view.mjs
          node tests/test_v014077_owner_qa_membership_reset.mjs
          node tests/test_v014078_account_source_management.mjs
      - name: Preserve confirmed sandbox payment lifecycle and gates
        run: |
          node tests/test_v014056_unified_payment_readiness.mjs
          node tests/test_v014057_sandbox_acceptance.mjs
          node tests/test_v014055_payment_mode_middleware.mjs

      - name: Audit eight historic SKU prices and retained distribution rights warning
        run: node scripts/deployment15_catalog_audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GU-D15-Source-Catalog-Not-Live-${{ github.run_number }}
          path: artifacts/d15-catalog-source-integrity.json
          if-no-files-found: error
          retention-days: 30
