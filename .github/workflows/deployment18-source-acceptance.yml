name: Deployment 18 Coordinated Source Acceptance — Production Gate Locked
on:
  push:
    branches: [main]
    paths:
      - 'release-manifest.json'
      - 'data/commerce-config.json'
      - 'data/store-products.json'
      - 'data/stripe-product-registry-v01437.json'
      - 'scripts/deployment15_catalog_audit.mjs'
      - 'data/competency-lab-paths-v01499.json'
      - 'data/competency-study-guides-v01499.json'
      - 'docs/curriculum-acceptance-decisions-v014150.json'
      - 'scripts/deployment18_acceptance_matrix.mjs'
      - 'scripts/curriculum-acceptance-evidence.mjs'
      - 'admin-unified-preview.html'
      - 'functions/api/support.js'
      - 'tests/test_v014157_support_security.mjs'
      - 'scripts/deployment17_source_security_readiness.mjs'
      - 'assets/js/admin-unified-*.mjs'
      - 'assets/js/premium-design-v014168.js'
      - 'assets/css/premium-design-v014168.css'
      - 'assets/js/navigation.js'
      - 'assets/css/mobile-auth.css'
      - 'dashboard.html'
      - 'bootcamp-academy.html'
      - 'index.html'
      - 'tests/test_premium_shell_contract.mjs'
      - 'tests/test_navigation_bundle.py'
      - '.github/workflows/deployment18-source-acceptance.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source-only release, Admin and commerce contract
        run: |
          node tests/test_v014155_release_metadata.mjs
          node tests/test_v014156_admin_shell.mjs
          node tests/test_v014156_admin_service_key_compatibility.mjs
          node tests/test_v014161_lab_engine_v32_teaching.mjs
          node tests/test_v014162_419_universal.mjs
          node tests/test_v014162_lab_player_context.mjs
          node tests/test_premium_shell_contract.mjs
          node tests/test_lab_v33_instructor.mjs
          node --check assets/js/premium-design-v014168.js
          node --check assets/js/navigation.js
          node tests/test_v014161_d17_admin_legacy_keys.mjs
          node --check scripts/deployment18_acceptance_matrix.mjs
          node --check assets/js/admin-unified-preview-v014156.mjs
      - name: Audit screenshot-derived eight-SKU catalog without LIVE certification
        run: node scripts/deployment15_catalog_audit.mjs
      - name: Verify Deployment 17 security boundaries before source evidence
        run: |
          node tests/test_v014157_support_security.mjs
          node tests/test_v014157_support_reopen_ui.mjs
          node tests/test_v014157_gws_owner_drafts.mjs
          node tests/test_v014157_legacy_forum_atomic.mjs
          node tests/test_v014157_public_seo.mjs
          node tests/test_v014157_sitewide_skip_navigation.mjs
          node scripts/deployment17_source_security_readiness.mjs
      - name: Reconcile all Owner requirements without implying acceptance
        run: node scripts/deployment17_requirements_reconciliation.mjs
      - name: Generate actual 419-Lab and 30-Day acceptance ledger
        run: node scripts/curriculum-acceptance-evidence.mjs
      - name: Consolidate sitewide evidence without granting acceptance
        run: node scripts/deployment18_acceptance_matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GU-D18-SOURCE-NOT-PRODUCTION-${{ github.run_number }}
          path: |
            artifacts/d17-source-security-readiness.json
            artifacts/d17-owner-requirements-reconciliation.json
            artifacts/d15-catalog-source-integrity.json
            artifacts/curriculum-acceptance-v014150.json
            artifacts/curriculum-acceptance-v014150.csv
            artifacts/d18-integrated-acceptance-source.json
            artifacts/d18-integrated-acceptance-source.md
          if-no-files-found: warn
          retention-days: 30
