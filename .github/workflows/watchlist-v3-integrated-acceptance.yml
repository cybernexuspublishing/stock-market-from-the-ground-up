name: Crownlight Watchlist Intelligence V3 Integrated Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/api/watchlist-*-v3.js'
      - 'assets/js/watchlist-*-v3.js'
      - 'assets/js/watchlist-intelligence-v2.js'
      - 'assets/js/advanced-tools.js'
      - 'assets/js/free-watchlist-v1.js'
      - 'assets/js/free-watchlist-fictional-echarts-v1.js'
      - 'free-watchlist.html'
      - 'assets/css/free-watchlist-v1.css'
      - 'tests/test_watchlist_free_advanced_continuity_v1.mjs'
      - 'advanced-tool.html'
      - 'simulator.html'
      - 'supabase/migrations/20261030_watchlist_*.sql'
      - 'tests/test_watchlist_v3_*.mjs'
      - 'tests/test_watchlist_intelligence_v2_browser.mjs'
      - '.github/workflows/watchlist-v3-integrated-acceptance.yml'
permissions:
  contents: read
jobs:
  authenticated-contracts-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source syntax, privilege boundaries and V3 flow tests
        run: |
          node --check functions/api/watchlist-journal-transfer-v3.js
          node --check functions/api/watchlist-chart-context-v3.js
          node --check functions/api/watchlist-alerts-v3.js
          node --check assets/js/watchlist-chart-handoff-v3.js
          node --check assets/js/watchlist-learning-v3.js
          node --check assets/js/watchlist-intelligence-v2.js
          node tests/test_watchlist_v3_integrations.mjs
          node --check assets/js/free-watchlist-fictional-echarts-v1.js
          node --check assets/js/advanced-tools.js
          node tests/test_watchlist_free_advanced_continuity_v1.mjs
      - name: Existing paid/free Journal Watchlist Talia and Chart regressions
        run: |
          node tests/test_watchlist_intelligence_v2.mjs
          node tests/test_journal_plan_handoff_v1.mjs
          node tests/test_v014150_watchlist_lifecycle.mjs
          node tests/test_free_watchlist_v1.mjs
          node tests/test_v014145_research_scanner.mjs
          node tests/test_journal_research_quality_v1.mjs
          node tests/test_crownlight_lab_handoff_v2.mjs
          node tests/test_v35_chart_tutor_integration.mjs
          node tests/test_v38_watchlist_learning_fidelity.mjs
      - name: Check Cloudflare publication includes new member assets but not SQL
        run: |
          bash scripts/build-pages.sh
          test -f public/assets/js/watchlist-chart-handoff-v3.js
          test -f public/assets/js/watchlist-learning-v3.js
          test -f public/advanced-tool.html
          test -f public/simulator.html
          test ! -e public/supabase
          test ! -d public/functions
  chromium-member-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned no-cost Playwright Chromium dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test integrated member Watchlist Journal alerts and Talia UI
        run: node tests/test_watchlist_intelligence_v2_browser.mjs
      - name: Test Chart Studio authenticated saved research and account isolation
        run: node tests/test_watchlist_v3_chart_browser.mjs

  broad-regression-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned free Playwright and Apache ECharts for comparison
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 echarts@6.1.0
          npx playwright install --with-deps chromium
      - name: Compare 153 focused JavaScript tests against pre-V2 main
        run: |
          git worktree add --detach "$RUNNER_TEMP/watchlist-baseline" 78b3b93ccf70252127265cd7c16589e2bd7d4ae2
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/watchlist-baseline/node_modules"
          WATCHLIST_DIAG_OUTPUT="$RUNNER_TEMP/watchlist-v3-report" node scripts/watchlist-regression-diff-v2.mjs "$RUNNER_TEMP/watchlist-baseline" "$GITHUB_WORKSPACE"
