name: Stripe Registered Product Contract v0.14.0.37
on:
  push:
    paths:
      - 'assets/js/admin-stripe-catalog-v01437.js'
      - 'assets/css/admin-stripe-catalog-v01437.css'
      - 'functions/api/stripe-product-readiness-v01437.js'
      - 'data/stripe-product-registry-v01437.json'
      - 'config.js'
      - 'sw.js'
      - 'assets/js/site.js'
      - 'assets/js/admin-payment-center-v01433.js'
      - 'tests/test_v014037_*'
      - '.github/workflows/stripe-registered-catalog-v01437.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stripe catalog and build version checks
        run: python tests/test_v014037_release_contract.py
      - name: Stripe readiness mock integration checks
        run: node tests/test_v014037_stripe_readiness.mjs
