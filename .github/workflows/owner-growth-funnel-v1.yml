name: Owner Growth Funnel V1 — Aggregate Privacy & Production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-growth-funnel-v1.yml'
      - 'functions/api/owner-growth-funnel.js'
      - 'tests/test_owner_growth_funnel_v1.mjs'
      - 'tests/test_owner_growth_production_smoke_v1.mjs'
permissions:
  contents: read
concurrency:
  group: owner-growth-funnel-v1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner-growth:
    name: Verify safe aggregate server logic and production access denial
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source and synthetic member attribution tests
        run: |
          node --check functions/api/owner-growth-funnel.js
          node --check assets/js/owner-growth-funnel-v1.js
          node tests/test_owner_growth_funnel_v1.mjs
      - name: Real production read-only unauthorized access smoke
        run: node tests/test_owner_growth_production_smoke_v1.mjs
