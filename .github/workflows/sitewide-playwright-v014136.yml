name: Sitewide Playwright & Stripe Noncharging Regression v0.14.0.136
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# Runs against the checked-out commit, never against an unpredictable live site.
# No secrets, sign-in, payments, or external production calls from this workflow.
# Routine main pushes supersede obsolete push checks. A manually requested
# release-acceptance run and a deliberate re-run (attempt > 1) are isolated
# by run_id, so subsequent unrelated pushes cannot cancel them. This preserves exact-commit evidence without
# forcing every rapid development push through costly duplicate browser runs.
concurrency:
  group: sitewide-playwright-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.run_attempt == 1 }}
jobs:
  sitewide-browser:
    name: Website Playwright (all major sections, mobile, accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build exact Pages static output (preserve private content boundary)
        run: |
          bash scripts/build-pages.sh
          test -f public/index.html
          test ! -e public/data/interactive-labs.json
          test ! -d public/supabase
          test ! -d public/functions
      - name: Validate published Pages Functions routing and free-tier static exclusions
        run: node tests/test_pages_functions_route_manifest_v014257.mjs
      - name: Verify all 419 authorized universal Lab study bridges
        run: |
          node tests/test_v014162_419_universal.mjs
          node tests/test_v33_workstation_source_contract.mjs
          node tests/test_v32_prototype_exact_fidelity.mjs
          node tests/test_v32_member_reference_integrity.mjs
          node tests/test_v32_reference_route_boundary.mjs
          node tests/test_v33_production_dropdown_and_start.mjs
          node tests/test_v33_reflection_progress_recovery.mjs
          node tests/test_lab_ux_std001.mjs
          node tests/test_v33_approved_learning_redesign.mjs
          node tests/test_lab_v33_instructor.mjs
          node tests/test_v33_focus_workspace.mjs
          node tests/test_v34_unified_curriculum.mjs
          node tests/test_v014167_talia_five_candle_tabs.mjs
          node tests/test_v014168_419_teaching_bridges.mjs
          node tests/test_v014168_academy_family.mjs
          node tests/test_v014170_academy_member_contract.mjs
          node tests/test_v35_chart_tutor_integration.mjs
          node tests/test_v32_reference_source_fidelity.mjs
          node tests/test_v33_grading_display.mjs
          node tests/test_lab_v33_historical_setup_metadata.mjs
          node tests/test_v33_learning_profile_signin.mjs
          node tests/test_v33_member_first_name.mjs
          node tests/test_v33_teaching_content_quality.mjs
          node tests/test_v014162_lab_player_context.mjs
          node tests/test_lab_content_access_recovery.mjs
          node tests/test_lab_batch01_authenticated_access.mjs
      - name: Verify Bootcamp 30-day shared v3.2 journey
        run: node tests/test_v014162_bootcamp_v32.mjs
      - name: Verify approved Lab Engine v3.2 source boundaries
        run: node tests/test_v014161_lab_engine_v32_teaching.mjs
      - name: Enforce all nine Lab Engine v3.2 progression boundaries
        run: node tests/test_v014162_v32_stage_integrity.mjs
      - name: Verify Owner social marketing API and zero-spend provider security on exact commit
        run: |
          node --check functions/api/admin-social.js
          node --check assets/js/admin-social-operations-v014278.js
          node --test tests/test_admin_social_zero_cost.mjs tests/test_social_provider_capabilities.mjs
      - name: Install pinned Chromium browser test runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Browser-verify grouped Admin navigation, role isolation and all five Store tabs
        run: node tests/test_admin_organized_browser_v1.mjs
      - name: Browser-measure Admin layout density and Founders field containment
        run: node tests/test_admin_visual_layout_v1.mjs
      - name: Browser-verify Social Marketing Owner workspace at four responsive widths (mocked, no charges)
        run: node tests/test_admin_social_browser.mjs
      - name: Validate production-safe canonical and source sitemap generation
        run: |
          node tests/test_v014157_public_seo.mjs
          node tests/test_v014157_sitewide_skip_navigation.mjs
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/assets/css/sitewide-accessibility-v014157.css
          grep -q 'gu-skip-link' public/dashboard.html
          grep -q 'noindex,nofollow' public/dashboard.html
      - name: Start local source-only Pages fixture
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory public >/tmp/gu-sitewide-playwright.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/index.html >/dev/null
      - name: Browser-test production Founders Commons access and design voting at mobile/desktop sizes
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_founders_commons_browser_v014178.mjs
      - name: Browser-test Founding 600 Standard and Extended simulated member journeys
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_f600_member_pages_browser_v014220.mjs
      - name: Run central Playwright website regression
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/sitewide-playwright-v014136.mjs
      - name: Browser-verify all 30 Bootcamp days, keyboard navigation, responsive layouts and member privacy
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014144_bootcamp_browser.mjs
      - name: Browser-verify all Academy durations, member enrollment, private progress and account-switch isolation
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014168_academy_browser.mjs
      - name: Chromium-verify Scanner Builder data validation and private source notes
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014145_research_scanner_browser.mjs
      - name: Browser-verify exact owner v3.2 self-contained reference (mobile and desktop)
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v32_reference_exact_browser.mjs
      - name: Verify owner-exact v3.2 member reference journeys start to results
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v32_member_operational_browser.mjs
      - name: Browser-test approved Lab Engine v3.2 teaching at mobile and desktop widths
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014161_lab_engine_v32_browser.mjs
      - name: Browser-test nine-stage universal engine across canonical collections
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014162_universal_browser.mjs
      - name: Browser-verify LAB-UX-STD-001 chart-first curriculum and concealed assessments
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: |
          node tests/test_lab_ux_std001_browser.mjs
          node tests/test_v33_talia_question_flow_browser.mjs
          node tests/test_v33_reference_parity_browser.mjs
          node tests/test_v36_candle_slider_and_worked_browser.mjs
      - name: Browser-verify in-page v3.3 Labs retain website navigation
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v33_inline_registry_shell.mjs
      - name: Browser-verify real Lab Player authorization, 419 fallback, and v3.2 mode/reset boundaries
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014162_member_player_browser.mjs
      - name: Verify read-only Admin member inspection on mobile and desktop
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014157_admin_read_browser.mjs
      - name: Verify member-scoped Support API protection without live services
        run: |
          node tests/test_v014157_support_security.mjs
          node tests/test_v014157_support_reopen_ui.mjs
          node tests/test_v014157_gws_owner_drafts.mjs
          node tests/test_v014157_legacy_forum_atomic.mjs
          node --check functions/api/admin.js
          node --check assets/js/admin.js
          node --check functions/api/gws-projects.js
          node --check assets/js/production-completion.js
          node scripts/deployment17_source_security_readiness.mjs
      - name: Verify Owner delivery plan and roadmap governance contracts
        run: |
          node tests/test_v014141_owner_delivery_governance.mjs
          node tests/test_owner_roadmap_progress_v014045.mjs
          node tests/test_owner_roadmap_workflow_v014063.mjs
          node --check assets/js/admin-delivery-brief.js
          node --check assets/js/owner-roadmap.js
          node --check functions/api/owner-roadmap.js
      - name: Verify header search, unread alerts and desktop viewport containment
        run: node tests/test_v014138_header_badge_playwright.mjs
      - name: Verify secure eight-SKU LIVE quote presentation and terms (no charges)
        env:
          SITEWIDE_TEST_BASE: http://127.0.0.1:8765
        run: node tests/test_v014137_checkout_quote_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-playwright-report
          path: artifacts/sitewide-playwright-v014136.json
          if-no-files-found: warn
          retention-days: 30

  stripe-noncharging-contract:
    name: Stripe signed lifecycle and reconciliation contract (mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no-charge checkout and signed LIVE entitlement contract
        run: |
          node tests/test_v014058_live_fulfillment.mjs
          node tests/test_v014140_live_checkout_recovery.mjs
          node tests/test_v014064_checkout_wiring.mjs
          node tests/test_v014067_live_merchant_readiness.mjs
          node tests/test_v014068_stable_webhook.mjs
          node tests/test_v014089_checkout_readiness_no_charge.mjs
          node tests/test_v014084_store_interaction.mjs
          node tests/test_v014167_crownlight_store.mjs
          node tests/test_v014085_bundled_guide_contract.mjs
          node tests/test_v014090_commercial_product_inventory.mjs
      - name: Verify customer portal, scheduler, and Owner billing evidence
        run: |
          node tests/test_v014122_member_billing_portal.mjs
          node tests/test_v014129_stripe_only_cron.mjs
          node tests/test_v014131_stable_billing_endpoint.mjs
          node tests/test_v014133_billing_redirect_policy.mjs
          node tests/test_v014134_owner_billing_evidence.mjs
      - name: Enforce static site and one stable Stripe webhook URL
        run: |
          node --check functions/api/stripe-live-checkout-v01458.js
          node --check functions/api/stripe-live-checkout.js
          node --check assets/js/checkout-platform.js
          node --check functions/api/stripe-live-webhook.js
          node --check functions/api/billing-reconciliation-health.js
          node --check assets/js/admin-billing-reconciliation.js
          test -f functions/api/stripe-live-webhook.js
          grep -q "stripe-live-webhook-v01458" functions/api/stripe-live-webhook.js
