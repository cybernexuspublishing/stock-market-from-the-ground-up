name: Founding 600 — Positive Noncommercial Founder Access QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tests/test_f600_positive_owner_qa_browser.mjs
      - .github/workflows/f600-positive-owner-qa-browser.yml
permissions:
  contents: read
concurrency:
  group: f600-positive-owner-qa-browser
  cancel-in-progress: false
jobs:
  positive-founder-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free Chromium QA dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test genuine James_Test Owner-issued noncommercial access
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_f600_positive_owner_qa_browser.mjs
