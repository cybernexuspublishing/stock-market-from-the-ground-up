name: Premium Release — Live Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard.html'
      - 'learn.html'
      - 'labs.html'
      - 'bootcamp-academy.html'
      - 'store.html'
      - 'assets/css/premium-design-v014168.css'
      - 'assets/css/sitewide-composition-v014234.css'
      - 'functions/_middleware.js'
      - 'assets/js/site.js'
      - 'assets/js/navigation.js'
      - 'tests/test_workspace_layout_browser.py'
      - 'assets/js/premium-design-v014168.js'
      - 'functions/api/website-design.js'
      - 'tests/test_theme_service_browser.py'
      - 'assets/js/member-dashboard.js'
      - 'assets/js/production-completion.js'
      - 'assets/js/frontend-complete.js'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'assets/css/layout-integrity.css'
      - 'skills.html'
      - 'simulator.html'
      - 'journal.html'
      - 'my-books.html'
      - 'admin.html'
      - 'market-commons.html'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'assets/js/production-completion.js'
      - 'assets/js/home-community.js'
      - 'assets/js/supabase-client.js'
      - 'assets/js/sitewide-runtime.js'
      - 'tests/test_supabase_client_singleton.mjs'
      - 'tests/test_frontend_stabilization_browser.py'
      - 'tests/test_premium_browser_live.py'
      - '.github/workflows/premium-live-browser-qa.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live-public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify shared initialization and build before browser acceptance
        run: |
          node tests/test_supabase_client_singleton.mjs
          node tests/test_premium_shell_contract.mjs
          node tests/test_v014157_sitewide_skip_navigation.mjs
          bash scripts/build-pages.sh
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test built static frontend without provider access
        run: python tests/test_frontend_stabilization_browser.py
      - name: Verify workspace navigation and unchanged teaching layouts
        run: python tests/test_workspace_layout_browser.py
        env:
          GU_WORKSPACE_BASE_REF: HEAD^
      - name: Verify theme service failure and recovery in browser
        run: python tests/test_theme_service_browser.py
      - name: Test published route layouts at desktop tablet and mobile widths
        run: python tests/test_premium_browser_live.py
        env:
          GU_PRODUCTION_URL: https://stock-market-from-the-ground-up-d1r.pages.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-live-browser-evidence-${{ github.run_number }}
          path: |
            artifacts/premium-browser/
            artifacts/frontend-stabilization/
            artifacts/workspace-layout/
          if-no-files-found: warn
          retention-days: 14
