name: Premium Release — Live Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'dashboard.html'
      - 'learn.html'
      - 'labs.html'
      - 'bootcamp-academy.html'
      - 'store.html'
      - 'assets/css/premium-design-v014168.css'
      - 'assets/css/sitewide-composition-v014234.css'
      - 'functions/_middleware.js'
      - 'assets/js/member-dashboard.js'
      - 'assets/js/production-completion.js'
      - 'assets/js/frontend-complete.js'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'assets/css/layout-integrity.css'
      - 'skills.html'
      - 'simulator.html'
      - 'journal.html'
      - 'my-books.html'
      - 'admin.html'
      - 'market-commons.html'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'assets/js/production-completion.js'
      - 'assets/js/home-community.js'
      - 'tests/test_premium_browser_live.py'
      - '.github/workflows/premium-live-browser-qa.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  live-public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test published route layouts at desktop tablet and mobile widths
        run: python tests/test_premium_browser_live.py
        env:
          GU_PRODUCTION_URL: https://stock-market-from-the-ground-up.pages.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-live-browser-evidence-${{ github.run_number }}
          path: artifacts/premium-browser/
          if-no-files-found: warn
          retention-days: 14
