name: Deployment 16 Unified Admin Shell — Stages A and B
on:
  push:
    paths:
      - 'admin-unified-preview.html'
      - 'admin.html'
      - 'functions/api/admin-control-registry.js'
      - 'tests/test_admin_rbac_atomic_v014252.mjs'
      - 'tests/test_admin_role_editor_atomic_v014255.mjs'
      - 'tests/test_admin_stripe_test_provider_v014256.mjs'
      - 'tests/test_admin_production_guest_v014255.mjs'
      - 'tests/test_pages_functions_local_v014260.mjs'
      - 'tests/test_prelive_live_env_build_guard_v014261.mjs'
      - 'functions/api/runtime-health-v014259.js'
      - 'tests/test_pages_functions_route_manifest_v014257.mjs'
      - '_routes.json'
      - 'scripts/build-pages.sh'
      - 'tests/test_admin_staff_flag_gate_v014253.mjs'
      - 'tests/test_v014077_owner_qa_membership_reset.mjs'
      - 'tests/test_admin_legacy_authorization_v014254.mjs'
      - 'functions/api/admin-access-v01355.js'
      - 'functions/api/admin-site-v01354.js'
      - 'functions/api/admin-operations-center-v0135.js'
      - 'functions/api/admin-operations-v0135.js'
      - 'assets/js/admin-prelive-v014247.js'
      - 'assets/css/admin-prelive-v014247.css'
      - 'functions/api/admin-prelive-v014247.js'
      - 'tests/test_admin_prelive_v014247.mjs'
      - 'assets/js/admin.js'
      - 'assets/js/admin-platform.js'
      - 'assets/js/admin-legacy-routing.js'
      - 'tests/test_admin_session_and_error_gate_v014246.mjs'
      - 'assets/js/route-policy.js'
      - 'functions/api/admin.js'
      - 'functions/api/admin-accounts-v01353.js'
      - 'tests/test_v014156_admin_service_key_compatibility.mjs'
      - 'assets/js/admin-unified-*.mjs'
      - 'assets/css/admin-unified-preview-v014156.css'
      - 'tests/test_v014156_admin_shell.mjs'
      - 'tests/test_v014156_admin_stage_b_members_audit.mjs'
      - '.github/workflows/deployment16-admin-shell.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-a-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse Admin modules
        run: |
          node --check assets/js/admin-unified-core-v014156.mjs
          node --check assets/js/admin-unified-preview-v014156.mjs
          node --check assets/js/admin-unified-people-v014156.mjs
          node --check functions/api/admin.js
          node --check functions/api/runtime-health-v014259.js
          node --check functions/api/admin-control-registry.js
          node --check functions/api/admin-prelive-v014247.js
          node --check assets/js/admin-prelive-v014247.js
          node --check assets/js/admin.js
          node --check assets/js/admin-platform.js
          node --check assets/js/admin-legacy-routing.js
          node --check functions/api/admin-accounts-v01353.js
          node --check functions/api/admin-access-v01355.js
          node --check functions/api/admin-site-v01354.js
          node --check functions/api/admin-operations-center-v0135.js
          node --check functions/api/admin-operations-v0135.js
      - name: Verify Admin module registry, access boundaries and read-only preview
        run: |
          node tests/test_v014156_admin_shell.mjs
          node tests/test_v014156_admin_stage_b_members_audit.mjs
          node tests/test_v014156_admin_service_key_compatibility.mjs
          node tests/test_admin_session_and_error_gate_v014246.mjs
          node tests/test_admin_prelive_v014247.mjs
          node tests/test_admin_rbac_atomic_v014252.mjs
          node tests/test_prelive_live_env_build_guard_v014261.mjs
          node tests/test_admin_role_editor_atomic_v014255.mjs
          node tests/test_admin_stripe_test_provider_v014256.mjs
          node tests/test_pages_functions_route_manifest_v014257.mjs
          node tests/test_admin_staff_flag_gate_v014253.mjs
          node tests/test_admin_legacy_authorization_v014254.mjs
          node tests/test_v014077_owner_qa_membership_reset.mjs
          node tests/test_v014078_account_source_management.mjs


  stage-b-actual-local-functions:
    needs: stage-a-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build actual Pages static assets and route manifest
        run: |
          bash scripts/build-pages.sh
          test -f public/_routes.json
          test ! -d public/functions
      - name: Start local Wrangler Pages Functions engine
        run: |
          npm install --no-save --no-package-lock wrangler@3.114.17
          npx wrangler pages dev public --ip 127.0.0.1 --port 8792 >/tmp/ground-up-functions-runtime.log 2>&1 &
          echo $! >/tmp/ground-up-functions-runtime.pid
      - name: Require real local Pages routing for health and Admin handler
        run: |
          node tests/test_pages_functions_local_v014260.mjs || { tail -n 100 /tmp/ground-up-functions-runtime.log; exit 1; }

  stage-c-production-guest-tests:
    needs: stage-a-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real production anonymous API and privileged-write denials
        run: node tests/test_admin_production_guest_v014255.mjs
