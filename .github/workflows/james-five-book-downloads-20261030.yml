name: James Test Five EPUB Signed Download Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_james_five_book_downloads_20261030.mjs'
      - '.github/workflows/james-five-book-downloads-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secure-downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: James Test authenticated secure EPUB downloads
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_james_five_book_downloads_20261030.mjs
