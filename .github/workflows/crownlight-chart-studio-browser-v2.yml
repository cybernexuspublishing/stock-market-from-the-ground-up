permissions:
  contents: read
concurrency:
  group: crownlight-chart-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chart-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only pinned, public free packages
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 lightweight-charts@5.2.1 klinecharts@10.1.0 echarts@6.1.0
          npx playwright install --with-deps chromium
      - name: Run real offline Chromium chart studio checks
        run: |
          node --check assets/js/crownlight-chart-studio-v2.js
          node --check assets/js/crownlight-echarts-loader-v1.js
          node --check assets/js/crownlight-echarts-replay-v1.js
          node --check assets/js/crownlight-echarts-studio-v1.js
          node tests/test_crownlight_echarts_studio_browser_v1.mjs
          node --check assets/js/admin-products-v01489.js
          node tests/test_admin_products_tabs_chromium_v1.mjs
          node --check assets/js/crownlight-echarts-admin-v1.js
          node --check assets/js/crownlight-tradingview-datafeed-adapter-v1.js
          node tests/test_crownlight_echarts_tv_adapter_browser_v1.mjs
          node tests/test_crownlight_echarts_admin_smoke_v1.mjs
          node tests/test_crownlight_echarts_local_asset_v2.mjs
          node --check assets/js/crownlight-indicator-math-v2.js
          node tests/test_crownlight_chart_studio_v2.mjs
          node --check assets/js/crownlight-chart-tiers-v1.js
          node --check functions/api/chart-tier-access.js
          node --check functions/_lib/founder-offer-gate-v1.js
          node --check assets/js/store.js
          node tests/test_crownlight_chart_tiers_v1.mjs
          node --check assets/js/crownlight-workspace-v2.js
          node --check assets/js/crownlight-talia-lab-v2.js
          node --check functions/api/chart-workspace.js
          node tests/test_crownlight_chart_workspace_v2.mjs
          node --check assets/js/crownlight-lab-chart-handoff-v2.js
          node tests/test_crownlight_lab_handoff_v2.mjs
          node tests/test_crownlight_founder_storefront_v1.mjs
          node tests/test_crownlight_chart_tiers_browser_v1.mjs
          node tests/test_crownlight_studio_menu_api_v1.mjs
          node tests/test_crownlight_studio_menu_browser_v1.mjs
          node tests/test_crownlight_simulator_density_browser_v1.mjs
          node tests/test_crownlight_provider_entitlement_v1.mjs
          node --check functions/api/chart-studio-presentation.js
          node --check assets/js/crownlight-continuous-workspace-v1.js
          node --check assets/js/admin-crownlight-workspace-v1.js
          node tests/test_crownlight_owner_presentation_v1.mjs
          node --check functions/api/page-workspace-presentation.js
          node --check assets/js/site.js
          node tests/test_crownlight_page_presentation_v2.mjs
          node tests/test_crownlight_page_workspace_browser_v2.mjs
          node tests/test_crownlight_cardless_layout_v1.mjs
          node tests/test_sparks_nav_poll_v1.mjs
          node --check assets/js/navigation.js
          node --check assets/js/admin-sparks-pricing-v1.js
          node tests/test_crownlight_page_style_production_probe_v3.mjs
          node tests/test_crownlight_real_page_styles_v3.mjs
          node tests/test_crownlight_admin_style_gallery_browser_v1.mjs
          node tests/test_owner_self_sparks_browser_v1.mjs
          node tests/test_crownlight_continuous_layout_browser_v1.mjs
          node tests/test_crownlight_live_formation_v1.mjs
          node tests/test_crownlight_live_bridge_mock_v1.mjs
          node tests/test_crownlight_paper_workbench_v3.mjs
          node tests/test_site_card_layout_editor_v1.mjs
          node tests/test_site_card_layout_editor_browser_v1.mjs
          node --check assets/js/crownlight-site-layout-editor-v1.js
          node --check functions/api/site-card-layout.js
          node --check assets/js/bootcamp-academy-v014168.js
          node tests/test_alpaca_saved_paper_verification_v1.mjs
          node --check functions/api/credentials.js
          node tests/test_crownlight_workbench_browser_v3.mjs
          node tests/test_simulator_lab_context_v1.mjs
          node --check functions/api/simulator-lab-context.js
          node tests/test_owner_audit_dashboard_20261028.mjs
          node --check functions/api/alpaca-paper.js
          node --check assets/js/crownlight-simulator-layout-v3.js
          node --check assets/js/crownlight-paper-terminal-v1.js
          node --check assets/js/crownlight-chart-tutor-v1.js
          node --check assets/js/crownlight-live-formation-v1.js
          node --check functions/api/live-market-stream.js
          node --check functions/api/live-market-ticket.js
          node tests/test_crownlight_chart_browser_v2.mjs
      - name: Preserve mobile and desktop screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crownlight-chromium-screenshots
          path: artifacts/crownlight-*.png
          if-no-files-found: ignore
          retention-days: 7
