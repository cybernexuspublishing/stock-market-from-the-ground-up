name: Crownlight Chart Studio Real Chromium (Free, Offline)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/js/crownlight-chart-studio-v2.js'
      - 'assets/js/crownlight-chart-tiers-v1.js'
      - 'assets/css/crownlight-chart-tiers-v1.css'
      - 'functions/api/chart-tier-access.js'
      - 'functions/_lib/founder-offer-gate-v1.js'
      - 'functions/api/founding-offer-status.js'
      - 'functions/api/founding600-checkout.js'
      - 'assets/js/store.js'
      - 'assets/js/founding600-enrollment-v014198.js'
      - 'tests/test_crownlight_chart_tiers_v1.mjs'
      - 'tests/test_crownlight_chart_tiers_browser_v1.mjs'
      - 'supabase/migrations/20261028_crownlight_founder_600_public_launch_gate_v1.sql'
      - 'store.html'
      - 'founding600.html'
      - 'assets/js/crownlight-live-aggregator-v1.js'
      - 'assets/js/crownlight-live-formation-v1.js'
      - 'assets/css/crownlight-live-formation-v1.css'
      - 'functions/api/live-market-stream.js'
      - 'functions/api/live-market-ticket.js'
      - 'functions/_lib/crownlight-live-auth-v1.js'
      - 'tests/test_crownlight_live_formation_v1.mjs'
      - 'tests/test_crownlight_live_bridge_mock_v1.mjs'
      - 'tests/test_crownlight_paper_workbench_v3.mjs'
      - 'tests/test_crownlight_workbench_browser_v3.mjs'
      - 'assets/js/crownlight-paper-terminal-v1.js'
      - 'assets/js/crownlight-simulator-layout-v3.js'
      - 'functions/api/simulator-lab-context.js'
      - 'tests/test_simulator_lab_context_v1.mjs'
      - 'assets/css/crownlight-member-density-v1.css'
      - 'dashboard.html'
      - 'assets/css/member-profile-v1.css'
      - 'assets/js/member-dashboard.js'
      - 'tests/test_owner_audit_dashboard_20261028.mjs'
      - 'assets/js/crownlight-chart-tutor-v1.js'
      - 'assets/css/crownlight-simulator-layout-v3.css'
      - 'functions/api/alpaca-paper.js'
      - 'functions/api/credentials.js'
      - 'assets/js/dashboard-ui-legacy.js'
      - 'tests/test_alpaca_saved_paper_verification_v1.mjs'
      - 'functions/api/member-sparks-wallet.js'
      - 'supabase/migrations/20261028_free_two_sparks_monthly_v1.sql'
      - 'assets/js/simulator.js'
      - 'assets/js/crownlight-site-layout-editor-v1.js'
      - 'assets/css/crownlight-site-layout-editor-v1.css'
      - 'functions/api/site-card-layout.js'
      - 'assets/js/bootcamp-academy-v014168.js'
      - 'assets/css/member-profile-v1.css'
      - 'tests/test_site_card_layout_editor_v1.mjs'
      - 'tests/test_site_card_layout_editor_browser_v1.mjs'
      - 'supabase/migrations/20261028_sitewide_card_layout_editor_v1.sql'
      - 'simulator.html'
      - 'assets/js/crownlight-indicator-math-v2.js'
      - 'assets/css/crownlight-chart-studio-v2.css'
      - 'tests/test_crownlight_chart_browser_v2.mjs'
      - '.github/workflows/crownlight-chart-studio-browser-v2.yml'
permissions:
  contents: read
concurrency:
  group: crownlight-chart-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chart-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only pinned, public free packages
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1 lightweight-charts@5.2.1 klinecharts@10.1.0
          npx playwright install --with-deps chromium
      - name: Run real offline Chromium chart studio checks
        run: |
          node --check assets/js/crownlight-chart-studio-v2.js
          node --check assets/js/crownlight-indicator-math-v2.js
          node tests/test_crownlight_chart_studio_v2.mjs
          node --check assets/js/crownlight-chart-tiers-v1.js
          node --check functions/api/chart-tier-access.js
          node --check functions/_lib/founder-offer-gate-v1.js
          node --check assets/js/store.js
          node tests/test_crownlight_chart_tiers_v1.mjs
          node tests/test_crownlight_chart_tiers_browser_v1.mjs
          node tests/test_crownlight_live_formation_v1.mjs
          node tests/test_crownlight_live_bridge_mock_v1.mjs
          node tests/test_crownlight_paper_workbench_v3.mjs
          node tests/test_site_card_layout_editor_v1.mjs
          node tests/test_site_card_layout_editor_browser_v1.mjs
          node --check assets/js/crownlight-site-layout-editor-v1.js
          node --check functions/api/site-card-layout.js
          node --check assets/js/bootcamp-academy-v014168.js
          node tests/test_alpaca_saved_paper_verification_v1.mjs
          node --check functions/api/credentials.js
          node tests/test_crownlight_workbench_browser_v3.mjs
          node tests/test_simulator_lab_context_v1.mjs
          node --check functions/api/simulator-lab-context.js
          node tests/test_owner_audit_dashboard_20261028.mjs
          node --check functions/api/alpaca-paper.js
          node --check assets/js/crownlight-simulator-layout-v3.js
          node --check assets/js/crownlight-paper-terminal-v1.js
          node --check assets/js/crownlight-chart-tutor-v1.js
          node --check assets/js/crownlight-live-formation-v1.js
          node --check functions/api/live-market-stream.js
          node --check functions/api/live-market-ticket.js
          node tests/test_crownlight_chart_browser_v2.mjs
      - name: Preserve mobile and desktop screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crownlight-chromium-screenshots
          path: artifacts/crownlight-*.png
          if-no-files-found: ignore
          retention-days: 7
