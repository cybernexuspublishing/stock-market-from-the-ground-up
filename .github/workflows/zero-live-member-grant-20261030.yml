name: SMFGU QA-only $0 LIVE Member Entitlement and Reset
on:
  push:
    branches: [main]
    paths:
      - 'tests/test_zero_live_member_grant_20261030.mjs'
      - '.github/workflows/zero-live-member-grant-20261030.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-member:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Genuine zero-dollar LIVE hosted checkout, signed QA grant, tool access and reset
        env:
          LAB_QA_EMAIL: ${{ secrets.LAB_QA_EMAIL }}
          LAB_QA_PASSWORD: ${{ secrets.LAB_QA_PASSWORD }}
        run: node tests/test_zero_live_member_grant_20261030.mjs
