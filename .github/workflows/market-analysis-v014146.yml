name: Market Analysis, Tape & Private Journal v0.14.0.146
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-party-market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trading math, temporal safeguards, entitlement and private journal assertions
        run: |
          node tests/test_v014111_tool_math_boundaries.mjs
          node tests/test_v014110_advanced_tool_access_and_workspace.mjs
          node tests/test_v014145_research_scanner.mjs
          node tests/test_v014146_market_analysis.mjs
          node tests/test_v014146_private_journal.mjs
          node tests/test_v014114_private_journal_analytics.mjs
          node tests/test_sellable_journal_metric_contract_research8.mjs
          node tests/test_journal_future_exit_asof_v1.mjs
          node tests/test_journal_account_switch_scrub_v1.mjs
          node tests/test_journal_plan_handoff_v1.mjs
          node tests/test_journal_research_quality_v1.mjs
          node --check assets/js/journal-echarts-equity-v1.js
          node --check assets/js/journal-analytics.js
          node tests/test_journal_echarts_equity_v1.mjs
          node tests/test_trailing_stop_and_research_link_v1.mjs
          node --check functions/api/journal-research-links-v1.js
          node --check assets/js/journal-source-variance-v1.js
          node --check assets/js/trade-plan-trailing-model-v1.js
          node --check functions/api/journal-plan-prefill.js
          node --check assets/js/journal-plan-transfer-v1.js
          node --check assets/js/journal-research-free-v1.js
          node --check assets/js/journal-research-paid-v1.js
          node --check functions/api/journal-research-quality-v1.js
          node --check functions/_lib/journal-research-quality-v1.js
          node tests/test_journal_guided_integrity_v1.mjs
          node tests/test_journal_v2.mjs
          node tests/test_journal_visual_v3.mjs
          node tests/test_journal_calendar_setup_replay_v3.mjs
          node --check assets/js/journal-market-calendar-v3.js
          node --check assets/js/simulator-mode-v014112.js
          node --check assets/js/verified-replay-v01492.js
          node --check assets/js/journal-visual-v3.js
          node --check assets/js/journal-trade-story-v3.js
          node --check assets/js/journal-v2-logic.js
          node --check assets/js/journal-guided-v2.js
          node --check assets/js/journal-weekly-v2.js
          node --check assets/js/journal-guided-v1.js
          node --check assets/js/journal-common.js
          node --check assets/js/journal-evidence-v1.js
          node --check assets/js/journal-actual-history-v1.js
          node --check assets/js/journal-weekly-v1.js
          node --check assets/js/journal-entry.js
          node --check assets/js/journal.js
          node tests/test_sellable_simulator_csv_integrity_v1.mjs
          node tests/test_sellable_simulator_store_v1.mjs
          node --check assets/js/simulator.js
          node --check functions/_lib/journal-analytics-v014114.js
          node --check assets/js/journal-analytics.js
          node --check assets/js/market-analysis-engine-v014146.js
          node --check assets/js/market-analysis-workbenches-v014146.js
          node --check assets/js/advanced-tools.js
          node --check functions/api/advanced-journal-insights.js
          bash scripts/build-pages.sh
          test -f public/assets/js/market-analysis-engine-v014146.js
          test -f public/assets/js/market-analysis-workbenches-v014146.js
          test ! -e public/supabase
          test ! -d public/functions
